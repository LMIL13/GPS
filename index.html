<!DOCTYPE html>
<title>Carnet GPS Terrain</title>
<meta charset="utf-8">
<!-- App pensee pour un usage telephone/tablette uniquement (jamais desktop).
     viewport-fit=cover + les paddings env(safe-area-inset-*) plus bas dans le
     CSS evitent que la barre du bas ou le contenu passent sous l'encoche/la
     barre d'accueil des telephones a bords arrondis. maximum-scale=1 evite le
     zoom involontaire iOS au focus d'un champ de saisie (en plus du passage
     des champs a 16px de police, meme raison). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEADC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B15" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#EEEADC; --surface:#FBF9F2; --surface-2:#F2EEDE; --ink:#232B23; --ink-dim:#5B6357;
    --line:#D8D2BE; --accent:#D9600B; --accent-ink:#FFFFFF; --teal:#1B6E7C; --teal-ink:#FFFFFF;
    --good:#3E7A3B; --warn:#A6790A; --danger:#B23A2E;
    --shadow:0 1px 2px rgba(35,43,35,0.06), 0 4px 14px rgba(35,43,35,0.07);
    --font-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171B15; --surface:#1F241C; --surface-2:#262B21; --ink:#EDE9D8; --ink-dim:#A7AD98;
      --line:#333B2C; --accent:#F0791F; --accent-ink:#1A1200; --teal:#4FB3C4; --teal-ink:#05262B;
      --good:#6FBE6A; --warn:#E0A542; --danger:#E2685A;
      --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171B15; --surface:#1F241C; --surface-2:#262B21; --ink:#EDE9D8; --ink-dim:#A7AD98;
    --line:#333B2C; --accent:#F0791F; --accent-ink:#1A1200; --teal:#4FB3C4; --teal-ink:#05262B;
    --good:#6FBE6A; --warn:#E0A542; --danger:#E2685A;
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 6px 18px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);-webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;}
  ::selection{background:color-mix(in srgb, var(--accent) 30%, transparent);}
  h1,h2,h3{text-wrap:balance;margin:0;}
  button{font-family:inherit;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;color:inherit;}
  a{touch-action:manipulation;}

  /* App pensee pour telephone jusqu'a tablette (jamais desktop) : 720px
     laisse une tablette utiliser sa largeur au lieu de rester coincee dans
     une colonne etroite de type telephone, tout en restant une largeur de
     lecture confortable (le contenu ne s'etire jamais en pleine largeur). */
  #app{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top)) 16px 14px;background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-0.01em;}
  .brand-pin{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    background:var(--accent);color:var(--accent-ink);font-size:14px;flex:none;}
  .topbar-actions{display:flex;gap:8px;align-items:center;}

  main{padding:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom));flex:1;}

  .btn{appearance:none;border:1px solid transparent;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;
    cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2;transition:transform .08s ease, opacity .15s ease;}
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line);}
  .btn-ghost{background:transparent;color:var(--ink-dim);border-color:transparent;padding:8px 10px;}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb, var(--danger) 40%, transparent);}
  .btn-block{width:100%;justify-content:center;}
  .btn-sm{padding:7px 10px;font-size:12.5px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}

  .empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:64px 20px;color:var(--ink-dim);}
  .empty-state .glyph{font-size:36px;width:64px;height:64px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--accent);}
  .empty-state h2{font-size:17px;color:var(--ink);}
  .empty-state p{font-size:14px;margin:0;max-width:280px;}

  .home-choices{display:flex;flex-direction:column;gap:14px;padding:12px 0 8px;}
  .home-choice{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 16px;
    box-shadow:var(--shadow);display:flex;gap:16px;align-items:center;cursor:pointer;}
  .home-choice:active{transform:scale(0.99);}
  .home-choice .glyph{font-size:26px;width:54px;height:54px;border-radius:14px;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;color:var(--accent);flex:none;}
  .home-choice-body{flex:1;min-width:0;}
  .home-choice-title{font-weight:700;font-size:16.5px;}
  .home-choice-desc{font-size:13px;color:var(--ink-dim);margin-top:4px;}
  .home-choice-count{font-family:var(--font-mono);font-size:12px;color:var(--teal);margin-top:8px;}

  .list{display:flex;flex-direction:column;gap:10px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow);
    display:flex;gap:12px;align-items:center;cursor:pointer;}
  .card:active{transform:scale(0.99);}
  .thumb{width:56px;height:56px;border-radius:10px;background:var(--surface-2);flex:none;overflow:hidden;
    display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-size:20px;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-body{flex:1;min-width:0;}
  .card-title{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-meta{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);margin-top:2px;}
  .card-chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .chevron{color:var(--ink-dim);font-size:18px;flex:none;}

  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;
    letter-spacing:.01em;}
  .chip-good{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good);}
  .chip-warn{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn);}
  .chip-neutral{background:var(--surface-2);color:var(--ink-dim);}
  .chip-teal{background:color-mix(in srgb, var(--teal) 16%, transparent);color:var(--teal);}

  .section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .section-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);margin-bottom:12px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim);}
  .field input[type="text"],.field input[type="number"],.field input[type="time"],.field textarea{
    /* 16px (pas 15) : sous ce seuil, Safari iOS zoome automatiquement la
       page au focus d'un champ de saisie, ce qui derangeait la saisie sur
       telephone. */
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink);}
  .field input:focus,.field textarea:focus{outline:2px solid color-mix(in srgb, var(--accent) 55%, transparent);outline-offset:1px;}
  .field textarea{resize:vertical;min-height:60px;font-family:var(--font-sans);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .hint{font-size:12px;color:var(--ink-dim);margin-top:2px;}

  .carnet-row{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;}
  .carnet-row:first-child{border-top:none;padding-top:0;margin-top:0;}
  .carnet-row-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .carnet-row-head span{font-size:12.5px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;}
  .btn-link-danger{background:none;border:none;color:var(--danger);font-size:12px;font-weight:600;cursor:pointer;padding:0;}

  .segmented{display:flex;gap:8px;}
  .seg-btn{flex:1;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink-dim);font-size:13.5px;font-weight:600;cursor:pointer;text-align:center;}
  .seg-btn.active-good{background:color-mix(in srgb, var(--good) 18%, var(--surface-2));border-color:var(--good);color:var(--good);}
  .seg-btn.active-warn{background:color-mix(in srgb, var(--warn) 18%, var(--surface-2));border-color:var(--warn);color:var(--warn);}

  .photo-block{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface-2);}
  .photo-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:28px 16px;
    border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-dim);cursor:pointer;background:var(--surface-2);}
  .photo-drop .icon{font-size:22px;color:var(--accent);}
  .photo-drop span{font-size:13px;font-weight:600;}
  .photo-drop span.photo-hint{font-size:11.5px;font-weight:500;color:var(--ink-dim);text-align:center;}
  .photo-preview{position:relative;line-height:0;}
  .photo-preview img,.photo-preview canvas{width:100%;display:block;touch-action:none;background:#111;}
  .photo-retake{position:absolute;top:8px;right:8px;background:rgba(23,27,21,0.72);color:#fff;border:none;border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(3px);}
  .photo-expand{position:absolute;top:8px;left:8px;background:rgba(23,27,21,0.72);color:#fff;border:none;border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;backdrop-filter:blur(3px);}
  .photo-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;font-family:var(--font-mono);
    font-size:12px;color:var(--teal);background:var(--surface);}
  .photo-meta.is-empty{color:var(--ink-dim);}
  .photo-meta button{background:none;border:none;color:var(--ink-dim);font-size:12px;font-weight:600;cursor:pointer;
    text-decoration:underline;padding:0;font-family:var(--font-sans);}

  .anno-toolbar{display:flex;gap:6px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap;}
  .anno-btn{border-radius:8px;border:1px solid var(--line);background:var(--surface-2);padding:7px 10px;font-size:12px;
    font-weight:600;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:5px;}
  .anno-btn .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .anno-btn.active{outline:2px solid var(--accent);outline-offset:1px;}
  .anno-summary{padding:0 12px 12px;background:var(--surface);}
  .anno-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;
    border-bottom:1px solid var(--line);color:var(--ink-dim);}
  .anno-row:last-child{border-bottom:none;}
  .anno-row .val{color:var(--ink);font-family:var(--font-mono);}
  .anno-row button{background:none;border:none;color:var(--danger);font-size:11px;cursor:pointer;font-weight:600;}

  .formbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:transparent;pointer-events:none;z-index:30;}
  .formbar-inner{pointer-events:auto;max-width:720px;width:100%;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);}

  .selectbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:transparent;pointer-events:none;z-index:30;}
  .selectbar-inner{pointer-events:auto;max-width:720px;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);}
  .select-count{font-size:12.5px;font-weight:600;color:var(--ink-dim);margin-right:auto;}
  .card-select{position:relative;}
  .select-check{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;background:var(--surface);}
  .card-selected{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 8%, var(--surface));}
  .card-selected .select-check{border-color:var(--accent);background:var(--accent);color:var(--accent-ink);}

  .detail-photo{border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .detail-photo img{width:100%;display:block;}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--ink-dim);}
  .kv .v{font-family:var(--font-mono);text-align:right;}
  .coord-line{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--font-mono);
    font-size:12.5px;color:var(--teal);background:color-mix(in srgb, var(--teal) 10%, var(--surface-2));
    border-radius:8px;padding:8px 10px;margin-top:8px;}
  .coord-line button{background:none;border:none;color:var(--teal);cursor:pointer;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.03em;}

  #modal-root:empty{display:none;}
  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,17,0.55);display:flex;align-items:flex-end;justify-content:center;
    z-index:100;padding:0;}
  @media (min-width:600px){.modal-overlay{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:420px;border-radius:16px 16px 0 0;padding:20px;border:1px solid var(--line);
    box-shadow:var(--shadow);}
  @media (min-width:600px){.modal{border-radius:16px;}}
  .modal h3{font-size:16px;margin-bottom:4px;}
  .modal p{font-size:13px;color:var(--ink-dim);margin:0 0 14px;}
  .modal input{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
    font-size:16px;color:var(--ink);margin-bottom:14px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  #toast-root{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:200;pointer-events:none;padding:0 16px;}
  .toast{background:var(--ink);color:var(--bg);font-size:13px;font-weight:500;padding:10px 16px;border-radius:10px;
    box-shadow:var(--shadow);max-width:420px;text-align:center;}

  .icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;}

  .sync-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:color-mix(in srgb, var(--warn) 14%, var(--surface));border:1px solid color-mix(in srgb, var(--warn) 40%, var(--line));
    color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px;font-weight:500;}
  .sync-banner-danger{background:color-mix(in srgb, var(--danger) 14%, var(--surface));border-color:color-mix(in srgb, var(--danger) 40%, var(--line));color:var(--danger);}

  /* Vue plein ecran pour renseigner les cotations sur une photo
     d'environnement (meilleur visuel demande par l'utilisatrice) : la photo
     occupe tout l'ecran, la barre du bas garde les memes boutons +Mesure /
     +Objet et la liste, un bouton "Fermer" bien visible en haut permet de
     revenir en arriere a tout moment (notamment en cas d'erreur). */
  #fullscreen-root:empty{display:none;}
  /* z-index 90 : sous la modale (100) pour que la fenetre de saisie d'une
     distance/d'un libelle d'objet reste bien visible et utilisable par-
     dessus la vue plein ecran ; au-dessus de la barre du bas du formulaire
     (formbar, 30) pour bien la masquer. */
  .annotator-fullscreen{position:fixed;inset:0;z-index:90;background:#0B0D0A;display:flex;flex-direction:column;}
  .af-header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px calc(14px + env(safe-area-inset-left));
    background:rgba(0,0,0,0.82);color:#fff;}
  .af-header h3{font-size:14px;font-weight:600;color:#fff;}
  .af-close{background:rgba(255,255,255,0.14);color:#fff;border:none;border-radius:10px;padding:9px 16px;
    font-size:14px;font-weight:700;cursor:pointer;flex:none;}
  .af-canvas-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto;
    background:#0B0D0A;padding:10px;}
  .af-canvas-wrap canvas{max-width:100%;max-height:100%;width:auto;height:auto;touch-action:none;display:block;
    border-radius:4px;}
  .af-footer{flex:none;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom);max-height:42vh;overflow-y:auto;}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-pin">&#9678;</span><span>Carnet GPS Terrain</span></div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>
  <main id="view-root"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div id="fullscreen-root"></div>

<script>
(function(){
  "use strict";

  /* ---------- utilities ---------- */
  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }
  function clamp01(v){ return Math.max(0, Math.min(1, v)); }
  function escapeHtml(str){
    return String(str == null ? '' : str).replace(/[&<>"']/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }
  // Accepts either the current {measures:[...], objects:[...]} shape or the
  // older fixed {measures:[m0,m1], object:{...}|null} shape (fiches saved
  // before measures/objects became free-form lists) and normalizes to the
  // current shape, dropping empty slots.
  function normalizeAnnotations(a){
    a = a || {};
    var measures = Array.isArray(a.measures) ? a.measures.filter(Boolean) : [];
    var objects = Array.isArray(a.objects) ? a.objects.filter(Boolean) : (a.object ? [a.object] : []);
    return {measures: measures, objects: objects};
  }
  function qs(sel, root){ return (root||document).querySelector(sel); }
  function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function fmtDateTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
    }catch(e){ return iso; }
  }
  function fmtDateShort(iso){
    try{ return new Date(iso).toLocaleDateString('fr-FR'); }catch(e){ return iso; }
  }
  function fmtCoords(c){
    if(!c) return 'Position indisponible';
    var s = c.lat.toFixed(6) + ', ' + c.lon.toFixed(6);
    if(typeof c.alt === 'number' && !isNaN(c.alt)) s += ' &middot; alt ' + Math.round(c.alt) + ' m';
    if(typeof c.acc === 'number') s += ' &middot; &plusmn;' + Math.round(c.acc) + ' m';
    return s;
  }
  function fmtCoordsPlain(c){
    if(!c) return 'Position indisponible';
    return c.lat.toFixed(6) + ', ' + c.lon.toFixed(6);
  }
  function toast(msg){
    var root = qs('#toast-root');
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(function(){ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 320); }, 2600);
  }

  /* ---------- local storage (IndexedDB) ----------
     Every fiche lives ONLY on this device, in IndexedDB. There is no
     shared/centralized carnet: this app has no backend of its own, so the
     published page must stay a plain, publicly shareable page that opens
     for anyone with the link, on any Claude account or none. Each person
     keeps their own local carnet on their own phone and consolidates via
     the CSV/PDF exports (e-mail, shared drive, etc.) rather than through
     automatic sync. */
  // DB_VERSION passe a 2 en v26 pour ajouter le magasin CARNET_STORE (carnets
  // de terrain, distincts des fiches signaletiques) sans toucher au magasin
  // STORE existant : l'ouverture avec une version superieure declenche
  // onupgradeneeded, qui ne fait qu'ajouter le magasin manquant, sans effet
  // sur les fiches deja enregistrees sur l'appareil.
  var DB_NAME = 'gps-fieldbook-db', DB_VERSION = 2, STORE = 'pending', CARNET_STORE = 'carnets';
  var dbAvailable = true;
  function openDB(){
    return new Promise(function(resolve, reject){
      if(!window.indexedDB){ reject(new Error('no-idb')); return; }
      var req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = function(){
        var db = req.result;
        if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, {keyPath:'id'});
        if(!db.objectStoreNames.contains(CARNET_STORE)) db.createObjectStore(CARNET_STORE, {keyPath:'id'});
      };
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
  }
  function dbGetAll(storeName){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readonly');
        var req = tx.objectStore(storeName).getAll();
        req.onsuccess = function(){ resolve(req.result || []); };
        req.onerror = function(){ reject(req.error); };
      });
    });
  }
  function dbPut(storeName, entry){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(entry);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function dbDelete(storeName, id){
    return openDB().then(function(db){
      return new Promise(function(resolve, reject){
        var tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = function(){ resolve(); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  /* ---------- geolocation & images ---------- */
  // Raison precise d'un echec de geolocalisation, pour pouvoir l'afficher a
  // l'ecran (au lieu d'un simple "Position indisponible" qui ne permet pas de
  // savoir si c'est un blocage de permission ou un vrai probleme de signal).
  function geoErrorReason(err){
    if(!err) return 'unknown';
    switch(err.code){
      case 1: return 'denied';       // PERMISSION_DENIED
      case 2: return 'unavailable';  // POSITION_UNAVAILABLE
      case 3: return 'timeout';      // TIMEOUT
      default: return 'unknown';
    }
  }
  function geoErrorLabel(reason){
    switch(reason){
      case 'denied': return 'Autorisation de localisation refusee pour ce site (reglages du navigateur).';
      case 'unavailable': return 'Signal de localisation introuvable ici (GPS/WiFi/reseau).';
      case 'timeout': return 'Delai de localisation depasse.';
      case 'no-geo': return 'Localisation non prise en charge par ce navigateur.';
      default: return 'Raison inconnue.';
    }
  }
  function getLocationNative(){
    return new Promise(function(resolve){
      if(!navigator.geolocation){ resolve({coords:null, errorReason:'no-geo'}); return; }
      var settled = false;
      function toResult(pos){
        return {lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy, alt:pos.coords.altitude};
      }
      function fallbackLowAccuracy(){
        navigator.geolocation.getCurrentPosition(
          function(pos){
            if(settled) return;
            settled = true;
            resolve({coords: toResult(pos), errorReason: null});
          },
          function(err){
            if(settled) return;
            settled = true;
            resolve({coords: null, errorReason: geoErrorReason(err)});
          },
          {enableHighAccuracy:false, timeout:15000, maximumAge:60000}
        );
      }
      navigator.geolocation.getCurrentPosition(
        function(pos){
          if(settled) return;
          settled = true;
          resolve({coords: toResult(pos), errorReason: null});
        },
        function(){
          // La haute precision (GPS pur) peut echouer ou expirer en interieur ;
          // on retente avec une position moins precise (WiFi/reseau), comme le
          // font les applications natives (ex: Plans), plutot que d'abandonner.
          if(settled) return;
          fallbackLowAccuracy();
        },
        {enableHighAccuracy:true, timeout:8000, maximumAge:0}
      );
    });
  }
  // Filet de securite : sur certains telephones (constate en usage reel), les
  // callbacks natifs (succes ET erreur) de getCurrentPosition peuvent ne
  // jamais se declencher du tout - notamment quand la prise de photo via
  // l'appareil photo systeme met la page en arriere-plan pendant la demande
  // de localisation. Dans ce cas, les delais internes de getLocationNative()
  // (8 s + 15 s = 23 s max en theorie) ne suffisent pas a garantir une
  // reponse : l'app restait bloquee indefiniment sur "Localisation en
  // cours...". Ce filet force une reponse au bout de 25 s dans tous les cas.
  var LOCATION_WATCHDOG_MS = 25000;
  function getLocation(){
    var startedAt = Date.now();
    var watchdog = new Promise(function(resolve){
      setTimeout(function(){ resolve({coords:null, errorReason:'timeout', source:'watchdog'}); }, LOCATION_WATCHDOG_MS);
    });
    var native = getLocationNative().then(function(res){
      res.source = 'native';
      return res;
    });
    return Promise.race([native, watchdog]).then(function(res){
      // Combien de temps la reponse (succes ou echec) a-t-elle mis a
      // arriver, et est-elle venue de l'API native ou du filet de securite ?
      // Utile pour distinguer un vrai TIMEOUT natif (le telephone a
      // essaye et n'a pas reussi a obtenir de position, meme en basse
      // precision) d'un blocage total ou aucun callback ne se declenche
      // jamais (dans ce cas seul le filet de securite repond, a ~25 s pile).
      res.elapsedMs = Date.now() - startedAt;
      return res;
    });
  }
  function loadImageSource(file){
    if(window.createImageBitmap){
      return createImageBitmap(file, {imageOrientation:'from-image'}).catch(function(){ return loadImageFallback(file); });
    }
    return loadImageFallback(file);
  }
  function loadImageFallback(file){
    return new Promise(function(resolve, reject){
      var img = new Image();
      var url = URL.createObjectURL(file);
      img.onload = function(){ resolve(img); URL.revokeObjectURL(url); };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('image-load-failed')); };
      img.src = url;
    });
  }
  // Cahier des charges : chaque photo livree doit peser moins de 1 Mo (un
  // controle qualite reel a releve des photos superieures a 1 Mo). On garde
  // une marge de securite et on vise 950 Ko, pas exactement 1 048 576.
  var MAX_PHOTO_BYTES = 950 * 1024;
  function dataUrlByteSize(dataUrl){
    var i = dataUrl.indexOf(',');
    var b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
    return Math.floor(b64.length * 3 / 4);
  }
  // Encodes a canvas as JPEG, reducing quality and then (if quality alone
  // isn't enough) the pixel dimensions, until the result is under maxBytes.
  // Used both for the initial photo import and for the annotated/flattened
  // version, so no photo the app produces can end up over the limit.
  function encodeJpegUnderSize(sourceCanvas, maxBytes){
    var work = sourceCanvas;
    var quality = 0.85;
    var dataUrl = work.toDataURL('image/jpeg', quality);
    var guard = 0;
    while(dataUrlByteSize(dataUrl) > maxBytes && guard < 10){
      guard++;
      if(quality > 0.4){
        quality = Math.round((quality - 0.1) * 100) / 100;
      } else {
        var nw = Math.max(300, Math.round(work.width * 0.85));
        var nh = Math.max(200, Math.round(work.height * 0.85));
        if(nw === work.width && nh === work.height) break; // deja au plus petit
        var next = document.createElement('canvas');
        next.width = nw; next.height = nh;
        next.getContext('2d').drawImage(work, 0, 0, nw, nh);
        work = next;
        quality = 0.7;
      }
      dataUrl = work.toDataURL('image/jpeg', quality);
    }
    return dataUrl;
  }
  // orientationMode:
  //  - 'strict'  : rejette (Promise rejetee, err.code='portrait') toute image
  //                portrait. Utilise pour les 2 photos d'environnement, prises
  //                a l'horizon ou l'orientation du capteur est fiable.
  //  - 'confirm' : n'impose rien mais renvoie {dataUrl, isPortrait} pour que
  //                l'appelant puisse demander confirmation avant d'accepter.
  //                Utilise pour la photo de pres : viser le sol (telephone
  //                incline a plat au-dessus du point) prive le capteur
  //                d'orientation de reference verticale fiable, si bien
  //                qu'une photo prise telephone bien tenu en paysage peut
  //                malgre tout ressortir "portrait" en pixels (remarque
  //                terrain de l'utilisatrice) — mais une vraie photo prise
  //                telephone tenu en portrait doit quand meme etre signalee,
  //                d'ou la confirmation plutot qu'une acceptation silencieuse.
  //  - sinon     : aucune verification.
  function fileToDataURL(file, maxDim, orientationMode){
    return loadImageSource(file).then(function(src){
      var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
      var isPortrait = h >= w;
      if(orientationMode === 'strict' && isPortrait){
        var err = new Error('portrait-photo');
        err.code = 'portrait';
        throw err;
      }
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w*scale)), ch = Math.max(1, Math.round(h*scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(src, 0, 0, cw, ch);
      var dataUrl = encodeJpegUnderSize(canvas, MAX_PHOTO_BYTES);
      if(orientationMode === 'confirm') return {dataUrl: dataUrl, isPortrait: isPortrait};
      return dataUrl;
    });
  }
  function dataURLtoBlob(dataUrl){
    var parts = dataUrl.split(',');
    var meta = parts[0], b64 = parts[1];
    var mimeMatch = /data:(.*?);base64/.exec(meta);
    var mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:mime});
  }

  /* ---------- carte satellite du point (v18) ----------
     A la demande de l'utilisatrice, les coordonnees brutes affichees sous
     chaque photo sont remplacees par une seule carte satellite pour toute la
     fiche, generee a partir de la position de la "photo de pres". On
     compose l'image nous-memes (tuiles + epingle) via un canvas, a partir
     des tuiles satellite publiques Esri World Imagery (pas de cle API,
     utilisable directement depuis le navigateur). Si le reseau est absent ou
     les tuiles inaccessibles, on affiche "Carte indisponible" et on propose
     a l'utilisatrice de charger elle-meme une capture d'ecran (ex: prise
     dans l'app Plans). */
  var MAP_TILE_SIZE = 256;
  // Zoom 19 (v18) montrait une zone trop restreinte pour se reperer sur le
  // terrain (retour utilisatrice) ; 17 montre une zone environ 4x plus large
  // (quelques centaines de metres) tout en gardant le repere bien identifiable.
  var MAP_TILE_ZOOM = 17;
  var MAP_CANVAS_W = 480;
  var MAP_CANVAS_H = 320;
  var MAP_WATCHDOG_MS = 12000;
  function lonLatToWorldPx(lat, lon, zoom){
    var n = Math.pow(2, zoom);
    var x = (lon + 180) / 360 * n * MAP_TILE_SIZE;
    var latRad = lat * Math.PI / 180;
    var y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n * MAP_TILE_SIZE;
    return {x:x, y:y};
  }
  function loadTileImage(zoom, tx, ty, n){
    return new Promise(function(resolve){
      if(ty < 0 || ty >= n){ resolve(null); return; }
      var wrapped = ((tx % n) + n) % n;
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function(){ resolve(img); };
      img.onerror = function(){ resolve(null); };
      img.src = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/' + zoom + '/' + ty + '/' + wrapped;
    });
  }
  function drawMapPin(ctx, cx, cy){
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + 3, 7, 3, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(cx - 7, cy - 6);
    ctx.lineTo(cx, cy + 3);
    ctx.lineTo(cx + 7, cy - 6);
    ctx.closePath();
    ctx.fillStyle = '#E4572E';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(cx, cy - 15, 10, 0, Math.PI * 2);
    ctx.fillStyle = '#E4572E';
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#fff';
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy - 15, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.restore();
  }
  function drawMapAttribution(ctx){
    var text = 'Esri, Maxar';
    ctx.save();
    ctx.font = '10px sans-serif';
    var w = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(4, MAP_CANVAS_H - 16, w + 8, 14);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, 8, MAP_CANVAS_H - 6);
    ctx.restore();
  }
  function buildSatelliteMap(lat, lon){
    var zoom = MAP_TILE_ZOOM;
    var n = Math.pow(2, zoom);
    var center = lonLatToWorldPx(lat, lon, zoom);
    var topLeftX = center.x - MAP_CANVAS_W / 2;
    var topLeftY = center.y - MAP_CANVAS_H / 2;
    var firstTx = Math.floor(topLeftX / MAP_TILE_SIZE);
    var firstTy = Math.floor(topLeftY / MAP_TILE_SIZE);
    var lastTx = Math.floor((topLeftX + MAP_CANVAS_W) / MAP_TILE_SIZE);
    var lastTy = Math.floor((topLeftY + MAP_CANVAS_H) / MAP_TILE_SIZE);
    var tileJobs = [];
    for(var tx = firstTx; tx <= lastTx; tx++){
      for(var ty = firstTy; ty <= lastTy; ty++){
        tileJobs.push({tx:tx, ty:ty});
      }
    }
    var loadAll = Promise.all(tileJobs.map(function(t){
      return loadTileImage(zoom, t.tx, t.ty, n).then(function(img){ return {tx:t.tx, ty:t.ty, img:img}; });
    }));
    var watchdog = new Promise(function(resolve){ setTimeout(function(){ resolve(null); }, MAP_WATCHDOG_MS); });
    return Promise.race([loadAll, watchdog]).then(function(tiles){
      if(!tiles) throw new Error('map-timeout');
      var okCount = tiles.filter(function(t){ return !!t.img; }).length;
      if(okCount === 0) throw new Error('map-unavailable');
      var canvas = document.createElement('canvas');
      canvas.width = MAP_CANVAS_W; canvas.height = MAP_CANVAS_H;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#cfd8dc';
      ctx.fillRect(0, 0, MAP_CANVAS_W, MAP_CANVAS_H);
      tiles.forEach(function(t){
        if(!t.img) return;
        var px = t.tx * MAP_TILE_SIZE - topLeftX;
        var py = t.ty * MAP_TILE_SIZE - topLeftY;
        try{ ctx.drawImage(t.img, px, py); }catch(e){}
      });
      drawMapPin(ctx, MAP_CANVAS_W / 2, MAP_CANVAS_H / 2);
      drawMapAttribution(ctx);
      // toDataURL leve une SecurityError si une des tuiles a "souille" le
      // canvas (probleme CORS cote serveur de tuiles) : dans ce cas on
      // considere la carte indisponible plutot que de planter le rendu.
      return encodeJpegUnderSize(canvas, MAX_PHOTO_BYTES);
    });
  }
  function generateMap(lat, lon){
    state.mapMeta = {status:'pending', dataUrl:null, lat:lat, lon:lon, manual:false};
    render();
    // Meme logique que state.locationPromises : on garde une reference a
    // cette generation en cours pour que performSave() puisse l'attendre
    // (bornee par le filet de securite de buildSatelliteMap, 12 s max) au
    // lieu de sauvegarder une fiche sans carte ni coordonnees si
    // l'utilisatrice enregistre juste avant la fin du telechargement des
    // tuiles (bug reel constate : la carte n'apparaissait pas sur les
    // fiches enregistrees rapidement).
    var p = buildSatelliteMap(lat, lon).then(function(dataUrl){
      state.mapMeta = {status:'ready', dataUrl:dataUrl, lat:lat, lon:lon, manual:false};
      render();
    }).catch(function(){
      state.mapMeta = {status:'unavailable', dataUrl:null, lat:lat, lon:lon, manual:false};
      render();
    }).then(function(){
      if(state.mapPromise === p) state.mapPromise = null;
    });
    state.mapPromise = p;
    return p;
  }
  // Chargement d'une image choisie manuellement par l'utilisatrice (capture
  // d'ecran de sa position, prise elle-meme dans l'app Plans par exemple)
  // quand la carte automatique est indisponible. Contrairement aux photos du
  // terrain, une capture d'ecran peut tres bien etre en format portrait :
  // on ne rejette donc pas ce format ici (voir fileToDataURL pour les
  // photos, qui elle l'exige en paysage).
  function mapFileToDataURL(file, maxDim){
    return loadImageSource(file).then(function(src){
      var w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
      var scale = Math.min(1, maxDim / Math.max(w, h));
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(src, 0, 0, cw, ch);
      return encodeJpegUnderSize(canvas, MAX_PHOTO_BYTES);
    });
  }
  function handleMapFilePicked(file){
    if(!file) return;
    var p = mapFileToDataURL(file, 1000).then(function(dataUrl){
      state.mapMeta = {
        status: 'ready',
        dataUrl: dataUrl,
        lat: state.mapMeta ? state.mapMeta.lat : null,
        lon: state.mapMeta ? state.mapMeta.lon : null,
        manual: true
      };
      render();
      toast('Image chargee comme carte du point.');
    }).catch(function(){
      toast('Impossible de charger cette image.');
    }).then(function(){
      if(state.mapPromise === p) state.mapPromise = null;
    });
    state.mapPromise = p;
  }

  /* ---------- file export ----------
     This app is meant to be opened as a plain local file (or from any plain
     web host), not just inside a Claude viewer — so file export must work
     with an ordinary browser download, not only through the Claude
     "downloads" capability. We try the Claude capability first (harmless if
     this ever runs inside a Claude viewer again) and fall back to a normal
     Blob + <a download> click, which works in any real browser context. */
  var downloadsNs = null, downloadsChecked = false;
  function getDownloads(){
    if(downloadsChecked) return Promise.resolve(downloadsNs);
    if(!(window.claude && window.claude.use)) { downloadsChecked = true; return Promise.resolve(null); }
    return claude.use('downloads').then(function(ns){ downloadsNs = ns; downloadsChecked = true; return ns; })
      .catch(function(){ downloadsChecked = true; return null; });
  }
  function mimeForFilename(filename){
    var ext = (String(filename).split('.').pop() || '').toLowerCase();
    var map = {csv:'text/csv', txt:'text/plain', pdf:'application/pdf', jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', json:'application/json', zip:'application/zip',
      xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'};
    return map[ext] || 'application/octet-stream';
  }
  function browserDownload(filename, data){
    try{
      var blob = (data instanceof Blob) ? data : new Blob([data], {type: mimeForFilename(filename)});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      return true;
    }catch(e){ return false; }
  }
  function saveFile(filename, data){
    return getDownloads().then(function(dl){
      if(!dl){ return browserDownload(filename, data); }
      return dl.save({filename:filename, data:data}).then(function(){ return true; })
        .catch(function(err){
          if(err && err.code === 'declined'){ return false; }
          if(err && (err.code === 'extension_not_enabled' || err.code === 'rejected_extension')){ throw err; }
          return browserDownload(filename, data);
        });
    });
  }

  /* ---------- fichier .zip minimal (sans compression, sans bibliotheque) ----------
     Utilise uniquement pour regrouper des photos deja encodees en JPEG
     (donc deja compressees) : la methode "store" (pas de compression zip
     elle-meme) suffit, et evite d'avoir a embarquer un algorithme deflate. */
  function sanitizeFilenamePart(s){
    var str = String(s || '');
    if(str.normalize){ str = str.normalize('NFD').replace(/[̀-ͯ]/g, ''); }
    str = str.replace(/[^a-zA-Z0-9]+/g, '_').replace(/^_+|_+$/g, '');
    return str || 'point';
  }
  function strToUtf8Bytes(str){
    if(window.TextEncoder) return new TextEncoder().encode(str);
    var bytes = [];
    for(var i = 0; i < str.length; i++){
      var code = str.charCodeAt(i);
      if(code < 0x80){ bytes.push(code); }
      else if(code < 0x800){ bytes.push(0xC0 | (code >> 6), 0x80 | (code & 0x3F)); }
      else { bytes.push(0xE0 | (code >> 12), 0x80 | ((code >> 6) & 0x3F), 0x80 | (code & 0x3F)); }
    }
    return new Uint8Array(bytes);
  }
  var CRC32_TABLE = null;
  function crc32(bytes){
    if(!CRC32_TABLE){
      CRC32_TABLE = [];
      for(var n = 0; n < 256; n++){
        var c = n;
        for(var k = 0; k < 8; k++){ c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); }
        CRC32_TABLE[n] = c;
      }
    }
    var crc = 0 ^ (-1);
    for(var i = 0; i < bytes.length; i++){ crc = (crc >>> 8) ^ CRC32_TABLE[(crc ^ bytes[i]) & 0xFF]; }
    return (crc ^ (-1)) >>> 0;
  }
  function dataURLToBytes(dataUrl){
    var base64 = String(dataUrl).split(',')[1] || '';
    var binary = atob(base64);
    var bytes = new Uint8Array(binary.length);
    for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return bytes;
  }
  function buildZip(files){
    // files: [{name: string, bytes: Uint8Array}]. Methode "store" (0 = pas
    // de compression) : les JPEG sont deja compresses, deflate n'apporterait
    // rien et compliquerait inutilement l'implementation.
    var localParts = [], centralParts = [], offset = 0;
    var now = new Date();
    var dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
    var dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
    var UTF8_FLAG = 0x0800;
    files.forEach(function(f){
      var nameBytes = strToUtf8Bytes(f.name);
      var crc = crc32(f.bytes);
      var size = f.bytes.length;

      var localHeader = new Uint8Array(30 + nameBytes.length);
      var dv = new DataView(localHeader.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, UTF8_FLAG, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(10, dosTime, true);
      dv.setUint16(12, dosDate, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      dv.setUint16(28, 0, true);
      localHeader.set(nameBytes, 30);
      localParts.push(localHeader);
      localParts.push(f.bytes);

      var centralHeader = new Uint8Array(46 + nameBytes.length);
      var cdv = new DataView(centralHeader.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, UTF8_FLAG, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, dosTime, true);
      cdv.setUint16(14, dosDate, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      centralHeader.set(nameBytes, 46);
      centralParts.push(centralHeader);

      offset += localHeader.length + f.bytes.length;
    });
    var centralOffset = offset;
    var centralSize = centralParts.reduce(function(s, p){ return s + p.length; }, 0);
    var eocd = new Uint8Array(22);
    var edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, centralOffset, true);
    edv.setUint16(20, 0, true);
    var allParts = localParts.concat(centralParts, [eocd]);
    var totalSize = allParts.reduce(function(s, p){ return s + p.length; }, 0);
    var result = new Uint8Array(totalSize);
    var pos = 0;
    allParts.forEach(function(p){ result.set(p, pos); pos += p.length; });
    return result;
  }

  /* ---------- fichier .xlsx minimal (sans compression, sans bibliotheque) ----------
     Un .xlsx est simplement un .zip contenant quelques fichiers XML. On
     reutilise buildZip() ci-dessus (methode "store") pour l'empaqueter, et on
     ecrit a la main le strict minimum de XML que Excel/Numbers/Google Sheets
     savent ouvrir : [Content_Types].xml, les relations, un classeur a une
     seule feuille, une feuille de styles minimale (police normale + police
     grasse, pour les titres/en-tetes) et la feuille de donnees elle-meme.
     Toutes les valeurs sont ecrites en texte "en ligne" (t="inlineStr"), ce
     qui evite d'avoir a gerer une table de chaines partagees (sharedStrings)
     et reste tout a fait suffisant pour un carnet qui n'a pas besoin de
     formules. */
  function colLetter(n){
    var s = '', num = n + 1;
    while(num > 0){
      var rem = (num - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      num = Math.floor((num - 1) / 26);
    }
    return s;
  }
  function xmlEscape(s){
    return String(s === null || s === undefined ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
  }
  // matrix : tableau de lignes, chaque ligne un tableau de cellules
  // {v: valeur, s: index de style (0 normal, 1 gras, 2 gras+centre, 3 titre)}
  // ou null/undefined pour une cellule vide.
  function buildXlsxSheetXml(matrix){
    var rowsXml = matrix.map(function(rowCells, rowIdx){
      var r = rowIdx + 1;
      var cellsXml = (rowCells || []).map(function(cell, colIdx){
        if(!cell || cell.v === '' || cell.v === null || cell.v === undefined) return '';
        var ref = colLetter(colIdx) + r;
        var sAttr = cell.s ? ' s="' + cell.s + '"' : '';
        return '<c r="' + ref + '" t="inlineStr"' + sAttr + '><is><t xml:space="preserve">' + xmlEscape(cell.v) + '</t></is></c>';
      }).join('');
      if(!cellsXml) return '';
      return '<row r="' + r + '">' + cellsXml + '</row>';
    }).filter(Boolean).join('');
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<sheetData>' + rowsXml + '</sheetData></worksheet>';
  }
  function buildXlsxBytes(sheetName, matrix){
    var contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>' +
      '</Types>';
    var rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
    var workbookRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
      '</Relationships>';
    var workbook = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="' + xmlEscape(sheetName) + '" sheetId="1" r:id="rId1"/></sheets></workbook>';
    var styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
      '<fonts count="3">' +
        '<font><sz val="11"/><name val="Calibri"/></font>' +
        '<font><b/><sz val="11"/><name val="Calibri"/></font>' +
        '<font><b/><sz val="14"/><name val="Calibri"/></font>' +
      '</fonts>' +
      '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>' +
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>' +
      '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>' +
      '<cellXfs count="4">' +
        '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"/>' +
        '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0"><alignment horizontal="center"/></xf>' +
        '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0"><alignment horizontal="center"/></xf>' +
      '</cellXfs>' +
      '</styleSheet>';
    var sheet1 = buildXlsxSheetXml(matrix);
    var files = [
      {name: '[Content_Types].xml', bytes: strToUtf8Bytes(contentTypes)},
      {name: '_rels/.rels', bytes: strToUtf8Bytes(rootRels)},
      {name: 'xl/workbook.xml', bytes: strToUtf8Bytes(workbook)},
      {name: 'xl/_rels/workbook.xml.rels', bytes: strToUtf8Bytes(workbookRels)},
      {name: 'xl/styles.xml', bytes: strToUtf8Bytes(styles)},
      {name: 'xl/worksheets/sheet1.xml', bytes: strToUtf8Bytes(sheet1)}
    ];
    return buildZip(files);
  }

  /* ---------- photo annotator ---------- */
  function PhotoAnnotator(canvas, rawDataUrl, initialAnnotations, onNeedLabel, maxWidth){
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.raw = rawDataUrl;
    this.annotations = initialAnnotations || {measures:[], objects:[]};
    this.onNeedLabel = onNeedLabel || function(){};
    this.tool = null;
    this.pending = null;
    this.loaded = false;
    var self = this;
    this.img = new Image();
    this.ready = new Promise(function(resolve){
      self.img.onload = function(){
        // La vue plein ecran (v23) passe une resolution plus elevee (les
        // photos sources sont deja plafonnees a 1100px, voir fileToDataURL)
        // pour un rendu plus net sur un grand ecran de tablette ; la vue
        // normale garde 900 comme avant.
        var maxW = maxWidth || 900;
        var scale = Math.min(1, maxW / self.img.naturalWidth);
        canvas.width = Math.max(1, Math.round(self.img.naturalWidth * scale));
        canvas.height = Math.max(1, Math.round(self.img.naturalHeight * scale));
        self.redraw();
        self.loaded = true;
        resolve();
      };
    });
    this.img.src = rawDataUrl;
    canvas.addEventListener('pointerdown', function(e){ self.handleTap(e); });
  }
  PhotoAnnotator.COLORS = ['#12808F', '#E2680C'];
  PhotoAnnotator.prototype.setTool = function(tool){ this.tool = tool; this.pending = null; };
  PhotoAnnotator.prototype.handleTap = function(e){
    if(!this.tool) return;
    e.preventDefault();
    var rect = this.canvas.getBoundingClientRect();
    var x = clamp01((e.clientX - rect.left) / rect.width);
    var y = clamp01((e.clientY - rect.top) / rect.height);
    var p = {x:x, y:y};
    if(this.tool === 'object'){
      this.tool = null;
      this.onNeedLabel({kind:'object', point:p});
      return;
    }
    // 'measure': two taps define one segment; any number of measures allowed
    if(!this.pending){
      this.pending = p;
    } else {
      var a = this.pending, b = p;
      this.pending = null;
      this.tool = null;
      this.onNeedLabel({kind:'measure', a:a, b:b});
    }
  };
  PhotoAnnotator.prototype.commitMeasure = function(a, b, distance){
    this.annotations.measures.push({a:a, b:b, distance:distance});
    this.redraw();
  };
  PhotoAnnotator.prototype.commitObject = function(point, label){
    this.annotations.objects.push({p:point, label:label});
    this.redraw();
  };
  PhotoAnnotator.prototype.clearMeasure = function(index){ this.annotations.measures.splice(index, 1); this.redraw(); };
  PhotoAnnotator.prototype.clearObject = function(index){ this.annotations.objects.splice(index, 1); this.redraw(); };
  PhotoAnnotator.prototype.redraw = function(){
    var ctx = this.ctx, c = this.canvas;
    if(!c.width) return;
    ctx.clearRect(0,0,c.width,c.height);
    ctx.drawImage(this.img, 0, 0, c.width, c.height);
    var self = this;
    this.annotations.measures.forEach(function(m, i){
      self.drawLine(m.a, m.b, PhotoAnnotator.COLORS[i % PhotoAnnotator.COLORS.length], m.distance + ' m');
    });
    this.annotations.objects.forEach(function(o){
      self.drawMarker(o.p, o.label);
    });
  };
  PhotoAnnotator.prototype.drawLine = function(a, b, color, label){
    var c = this.canvas, ctx = this.ctx;
    var ax = a.x*c.width, ay = a.y*c.height, bx = b.x*c.width, by = b.y*c.height;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(4, c.width*0.005);
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    ctx.lineWidth = Math.max(2, c.width*0.0025);
    ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
    [[ax,ay],[bx,by]].forEach(function(pt){
      ctx.beginPath(); ctx.arc(pt[0],pt[1], Math.max(4,c.width*0.006), 0, Math.PI*2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.stroke();
    });
    this.drawLabel((ax+bx)/2, (ay+by)/2 - Math.max(14,c.width*0.02), label, color);
    ctx.restore();
  };
  PhotoAnnotator.prototype.drawMarker = function(p, label){
    var c = this.canvas, ctx = this.ctx;
    var x = p.x*c.width, y = p.y*c.height;
    ctx.save();
    ctx.beginPath(); ctx.arc(x,y, Math.max(6,c.width*0.008), 0, Math.PI*2);
    ctx.fillStyle = '#232B23'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    this.drawLabel(x, y - Math.max(18,c.width*0.026), label, '#232B23');
    ctx.restore();
  };
  PhotoAnnotator.prototype.drawLabel = function(x, y, text, color){
    var ctx = this.ctx;
    var fontSize = Math.max(13, this.canvas.width*0.02);
    ctx.font = '600 ' + fontSize + 'px "IBM Plex Mono", monospace';
    var padX = 7, padY = 4;
    var w = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(255,255,255,0.94)';
    ctx.fillRect(x - w/2 - padX, y - fontSize/2 - padY, w + padX*2, fontSize + padY*2);
    ctx.lineWidth = 1.5; ctx.strokeStyle = color;
    ctx.strokeRect(x - w/2 - padX, y - fontSize/2 - padY, w + padX*2, fontSize + padY*2);
    ctx.fillStyle = color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y + 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  };

          '<button class="btn btn-ghost btn-sm" data-action="back-to-home" title="Retour a l\'accueil">&larr; Accueil</button>' +
          '<button class="btn btn-secondary btn-sm" data-action="toggle-select-mode-carnet" title="Selectionner plusieurs carnets">&#9745; Selectionner</button>' +
          '<button class="btn btn-secondary btn-sm" data-action="pick-import-fiche" title="Importer une fiche ou un carnet envoye depuis un autre telephone">&#8613; Importer</button>' +
          '<input type="file" accept="application/json,.json" style="display:none" data-role="import-fiche-input">' +
          '<button class="btn btn-primary btn-sm" data-action="new-carnet">+ Nouveau carnet</button>';
      }
      root.innerHTML = storageBannerHtml() + renderCarnetList() + (state.carnetSelectMode ? selectCarnetBarHtml() : '');
    } else if(state.view === 'carnet-form'){
      if(qs('#carnet-form')) collectCarnetFormFields();
      actions.innerHTML = '<button class="btn btn-ghost btn-sm" data-action="cancel-carnet-form">Annuler</button>';
      root.innerHTML = renderCarnetForm();
    }
    // La vue plein ecran (cotations) n'existe que depuis le formulaire ; en
    // dehors de cette vue on la ferme silencieusement plutot que de risquer
    // de l'afficher au-dessus d'un ecran auquel elle ne correspond plus.
    if(state.view !== 'form') state.fullscreenSlot = null;
    var fsRoot = qs('#fullscreen-root');
    if(fsRoot){
      fsRoot.innerHTML = renderFullscreenAnnotator();
      mountFullscreenCanvas();
    }
  }

        '<div class="chevron">&rsaquo;</div>' +

      '<div class="home-choice" data-action="go-carnets">' +
        '<div class="glyph">&#128221;</div>' +
        '<div class="home-choice-body">' +
          '<div class="home-choice-title">Carnets de terrain</div>' +
          '<div class="home-choice-desc">Journal des sessions GPS statiques d\'un chantier (dates, heures, recepteurs).</div>' +

  function selectBarHtml(){
    var n = Object.keys(state.selectedIds).length;
    return '<div class="selectbar"><div class="selectbar-inner">' +
      '<span class="select-count">' + n + ' fiche' + (n === 1 ? '' : 's') + ' selectionnee' + (n === 1 ? '' : 's') + '</span>' +

  function selectCarnetBarHtml(){
    var n = Object.keys(state.selectedCarnetIds).length;
    return '<div class="selectbar"><div class="selectbar-inner">' +
      '<span class="select-count">' + n + ' carnet' + (n === 1 ? '' : 's') + ' selectionne' + (n === 1 ? '' : 's') + '</span>' +
      '<button type="button" class="btn btn-secondary btn-sm" data-action="export-selected-carnets"' + (n ? '' : ' disabled') + '>Envoyer</button>' +
