  function photoBlockHtml(slot, title, allowAnnotate){
    var meta = state.photoMeta[slot];
    var hasPhoto = meta && meta.dataUrl;
    var body;
    if(!hasPhoto){
      var hint = slot === 'close'
        ? 'Vous pouvez incliner le telephone vers le sol pour cette photo'
        : 'Format paysage obligatoire (telephone a l\'horizontale)';
      body = '<div class="photo-drop" data-action="pick-photo" data-slot="' + slot + '">' +
        '<div class="icon">&#128247;</div><span>Ajouter une photo</span>' +
        '<span class="photo-hint">' + hint + '</span></div>';
    } else if(allowAnnotate){
      body = '<div class="photo-preview"><canvas data-slot="' + slot + '"></canvas>' +
        '<button type="button" class="photo-expand" data-action="open-annotator-fullscreen" data-slot="' + slot + '">&#9974; Plein ecran</button>' +
        '<button type="button" class="photo-retake" data-action="pick-photo" data-slot="' + slot + '">Reprendre</button></div>';
    } else {
      body = '<div class="photo-preview"><img src="' + meta.dataUrl + '" alt="">' +
        '<button type="button" class="photo-retake" data-action="pick-photo" data-slot="' + slot + '">Reprendre</button></div>';
    }
    // La position brute (texte lat/lon) n'est plus affichee sous chaque
    // photo depuis la v18 : une seule carte satellite pour toute la fiche
    // (voir mapCardHtml, generee a partir de cette photo pour le slot
    // "close") la remplace. La position est toujours capturee en arriere-
    // plan pour chaque photo (utile pour le CSV), simplement plus montree ici.
    var metaLine = '';
    var toolbar = '';
    if(allowAnnotate && hasPhoto){
      var ann = normalizeAnnotations((state.annotators[slot] && state.annotators[slot].annotations));
      var nextColor = PhotoAnnotator.COLORS[ann.measures.length % PhotoAnnotator.COLORS.length];
      toolbar = '<div class="anno-toolbar">' +
        '<button type="button" class="anno-btn" data-action="set-tool" data-slot="' + slot + '" data-tool="measure"><span class="dot" style="background:' + nextColor + '"></span>+ Mesure</button>' +
        '<button type="button" class="anno-btn" data-action="set-tool" data-slot="' + slot + '" data-tool="object"><span class="dot" style="background:#232B23"></span>+ Objet</button>' +
        '</div>' +
        '<div class="anno-summary">' + annoListHtml(slot, ann) + '</div>';
    }
    return '<div class="section"><div class="section-title">' + title + '</div>' +
      '<div class="photo-block">' + body + metaLine + toolbar + '</div>' +
      '<input type="file" accept="image/*" capture="environment" style="display:none" data-role="file-input" data-slot="' + slot + '">' +
      '</div>';
  }
  function annoListHtml(slot, ann){
    var rows = '';
    ann.measures.forEach(function(m, i){ rows += annoRow('Mesure ' + (i+1), m.distance + ' m', slot, 'measure', i); });
    ann.objects.forEach(function(o, i){ rows += annoRow('Objet ' + (i+1), o.label, slot, 'object', i); });
    if(!rows) rows = '<div class="anno-row"><span class="val" style="color:var(--ink-dim);">Aucune mesure ajoutee (2 minimum requises) ni objet repere (facultatif)</span></div>';
    return rows;
  }
  function annoRow(label, value, slot, kind, index){
    return '<div class="anno-row"><span>' + escapeHtml(label) + '</span>' +
      '<span><span class="val">' + escapeHtml(value) + '</span> ' +
      '<button type="button" data-action="clear-annotation" data-slot="' + slot + '" data-kind="' + kind + '" data-index="' + index + '">effacer</button></span></div>';
  }

  function mapCardHtml(){
    var m = state.mapMeta;
    var hasClosePhoto = !!(state.photoMeta.close && state.photoMeta.close.dataUrl);
    // Les coordonnees precises restent affichees a cote de la carte (demande
    // explicite de l'utilisatrice apres la v18/v19) : la carte donne le
    // repere visuel, le texte garde la valeur exacte utilisable/copiable.
    // generateMap() fixe lat/lon des le debut (etat "pending"), donc elles
    // sont disponibles meme si la carte finit "indisponible".
    var coordsLine = (m && typeof m.lat === 'number' && typeof m.lon === 'number')
      ? '<div class="coord-line"><span>&#128205; ' + fmtCoordsPlain({lat:m.lat, lon:m.lon}) + '</span>' +
        '<button type="button" data-action="copy-coords" data-text="' + escapeHtml(m.lat.toFixed(6) + ', ' + m.lon.toFixed(6)) + '">Copier</button></div>'
      : '';
    var body;
    if(!hasClosePhoto){
      body = '<div class="hint">La carte apparaitra ici une fois la photo de pres prise et la position obtenue.</div>';
    } else if(!m || m.status === 'idle'){
      body = '<div class="hint">En attente de la position pour generer la carte&hellip;</div>' + coordsLine;
    } else if(m.status === 'pending'){
      body = '<div class="hint">Generation de la carte&hellip;</div>' + coordsLine;
    } else if(m.status === 'ready'){
      body = '<div class="detail-photo"><img src="' + m.dataUrl + '" alt="Carte du point"></div>' +
        coordsLine +
        (m.manual ? '<div class="hint" style="margin-top:6px;">Image chargee manuellement.</div>' : '');
    } else {
      body = '<div class="hint">&#9888; Carte indisponible (reseau ou position introuvable). Vous pouvez reessayer, ou charger vous-meme une capture d\'ecran de votre position (ex: app Plans).</div>' +
        coordsLine;
    }
    // Les boutons sont disponibles des qu'il y a une photo de pres (demande
    // explicite de l'utilisatrice), sans attendre que la carte automatique
    // ait fini de se generer : elle peut ainsi charger elle-meme une image
    // tout de suite si elle ne veut pas attendre le reseau sur le terrain.
    var buttons = hasClosePhoto
      ? '<div style="display:flex;gap:8px;margin-top:8px;">' +
          '<button type="button" class="btn btn-secondary btn-sm" data-action="retry-map">' + (m && m.status === 'ready' ? 'Regenerer' : 'Generer / Reessayer') + '</button>' +
          '<button type="button" class="btn btn-secondary btn-sm" data-action="pick-map-image">Charger une image</button>' +
        '</div>'
      : '';
    return '<div class="section"><div class="section-title">Carte du point</div>' + body + buttons +
      '<input type="file" accept="image/*" style="display:none" data-role="map-file-input">' +
      '</div>';
  }

  function renderForm(){
    var d = draft;
    return '<form id="entry-form">' +
      '<div class="section">' +
        '<div class="section-title">Identification du point</div>' +
        '<div class="field"><label for="f-name">Nom du point</label>' +
          '<input type="text" id="f-name" placeholder="Ex. R12, Borne Nord..." value="' + escapeHtml(d.pointName) + '" required></div>' +
        '<div class="field"><label for="f-nature">Nature du point</label>' +
          '<input type="text" id="f-nature" placeholder="Ex. Borne, repere de nivellement, point provisoire..." value="' + escapeHtml(d.natureDuPoint) + '"></div>' +
        '<div class="field"><label for="f-dossier">Numero de dossier</label>' +
          '<input type="text" id="f-dossier" placeholder="Ex. 2026-0142" value="' + escapeHtml(d.numeroDossier) + '"></div>' +
        '<div class="field"><label for="f-remarks">Remarques (optionnel)</label>' +
          '<textarea id="f-remarks" placeholder="Acces, contexte, observations...">' + escapeHtml(d.remarks) + '</textarea></div>' +
      '</div>' +

      photoBlockHtml('close', 'Photo de pres du point', false) +
      mapCardHtml() +

      photoBlockHtml('env1', 'Photo environnement 1', true) +
      photoBlockHtml('env2', 'Photo environnement 2', true) +

      '<div class="hint" style="margin-bottom:96px;">Au moins 2 mesures de cotation sont requises par photo d\'environnement (au-dela de 2, ajoutez-en autant que necessaire). Les objets reperes sont facultatifs et illimites. Touchez "+ Mesure" puis deux points sur la photo pour ajouter une distance, ou "+ Objet" puis un point pour reperer un objet.</div>' +
      '</form>' +
      '<div class="formbar"><div class="formbar-inner">' +
        '<button type="button" class="btn btn-secondary btn-block" data-action="cancel-form">Annuler</button>' +
        '<button type="button" class="btn btn-primary btn-block" data-action="save-entry">Enregistrer la fiche</button>' +
      '</div></div>';
  }

  function mountFormCanvases(){
    ['env1','env2'].forEach(function(slot){
      var meta = state.photoMeta[slot];
      if(!meta || !meta.dataUrl) return;
      var canvas = qs('canvas[data-slot="' + slot + '"]');
      if(!canvas) return;
      var existing = state.annotators[slot];
      var initialAnn = normalizeAnnotations(existing ? existing.annotations : null);
      var annotator = new PhotoAnnotator(canvas, meta.dataUrl, initialAnn, function(need){ onAnnotatorNeedLabel(slot, need); });
      state.annotators[slot] = annotator;
    });
  }

  // Titre affiche en haut de la vue plein ecran, garde en phase avec les
  // titres utilises dans le formulaire (photoBlockHtml).
  var SLOT_TITLES = {env1:'Photo environnement 1', env2:'Photo environnement 2'};

  // Vue plein ecran pour renseigner les cotations (mesures/objets) sur une
  // photo d'environnement avec un meilleur visuel, demandee par
  // l'utilisatrice apres usage sur le terrain. Reutilise le meme toolbar et
  // la meme liste que dans le formulaire (anno-toolbar/anno-summary, memes
  // data-action) : les clics y sont deja geres par la delegation d'evenements
  // existante, aucune logique nouvelle a dupliquer pour +Mesure/+Objet/effacer.
  function renderFullscreenAnnotator(){
    var slot = state.fullscreenSlot;
    if(!slot) return '';
    var meta = state.photoMeta[slot];
    if(!meta || !meta.dataUrl){ state.fullscreenSlot = null; return ''; }
    var ann = normalizeAnnotations(state.annotators[slot] && state.annotators[slot].annotations);
    var nextColor = PhotoAnnotator.COLORS[ann.measures.length % PhotoAnnotator.COLORS.length];
    return '<div class="annotator-fullscreen">' +
      '<div class="af-header"><h3>' + escapeHtml(SLOT_TITLES[slot] || 'Photo') + '</h3>' +
        '<button type="button" class="af-close" data-action="close-annotator-fullscreen">&#10005; Fermer</button></div>' +
      '<div class="af-canvas-wrap"><canvas data-slot="' + slot + '"></canvas></div>' +
      '<div class="af-footer">' +
        '<div class="anno-toolbar">' +
          '<button type="button" class="anno-btn" data-action="set-tool" data-slot="' + slot + '" data-tool="measure"><span class="dot" style="background:' + nextColor + '"></span>+ Mesure</button>' +
          '<button type="button" class="anno-btn" data-action="set-tool" data-slot="' + slot + '" data-tool="object"><span class="dot" style="background:#232B23"></span>+ Objet</button>' +
        '</div>' +
        '<div class="anno-summary">' + annoListHtml(slot, ann) + '</div>' +
      '</div>' +
    '</div>';
  }
  function mountFullscreenCanvas(){
    var slot = state.fullscreenSlot;
    if(!slot) return;
    var meta = state.photoMeta[slot];
    if(!meta || !meta.dataUrl) return;
    var fsRoot = qs('#fullscreen-root');
    var canvas = fsRoot && qs('canvas[data-slot="' + slot + '"]', fsRoot);
    if(!canvas) return;
    var existing = state.annotators[slot];
    var initialAnn = normalizeAnnotations(existing ? existing.annotations : null);
    // maxWidth 1200 : les photos sources sont deja plafonnees a 1100px
    // (fileToDataURL), donc ceci utilise en pratique toute la resolution
    // disponible au lieu du plafond de 900 utilise pour la vignette normale.
    var annotator = new PhotoAnnotator(canvas, meta.dataUrl, initialAnn, function(need){ onAnnotatorNeedLabel(slot, need); }, 1200);
    state.annotators[slot] = annotator;
  }

  function onAnnotatorNeedLabel(slot, need){
    var annotator = state.annotators[slot];
    if(need.kind === 'measure'){
      openPromptModal({
        title: 'Distance mesuree',
        message: 'Indiquez la distance entre les deux points touches sur la photo.',
        inputType: 'number', placeholder: 'Ex. 4.20', confirmLabel: 'Valider',
        onConfirm: function(val){
          if(!val){ annotator.redraw(); return; }
          annotator.commitMeasure(need.a, need.b, val);
          render();
        }
      });
    } else {
      openPromptModal({
        title: 'Objet repere',
        message: 'Nommez l\'objet repere a cet endroit sur la photo.',
        inputType: 'text', placeholder: 'Ex. poteau, arbre, borne voisine', confirmLabel: 'Valider',
        onConfirm: function(val){
          if(!val){ annotator.redraw(); return; }
          annotator.commitObject(need.point, val);
          render();
        }
      });
    }
  }

  function renderDetail(e){
    if(!e) return '<div class="hint">Fiche introuvable.</div>';
    var photoCard = function(slot, title){
      var p = e.photos && e.photos[slot];
      if(!p || !p.dataUrl) return '<div class="section"><div class="section-title">' + title + '</div><div class="hint">Aucune photo</div></div>';
      var extra = '';
      var ann = normalizeAnnotations(p.annotations);
      if(ann.measures.length || ann.objects.length){
        extra = '<div style="margin-top:10px;">' +
          ann.measures.map(function(m, i){ return '<div class="kv"><span class="k">Mesure ' + (i+1) + '</span><span class="v">' + escapeHtml(m.distance) + ' m</span></div>'; }).join('') +
          ann.objects.map(function(o, i){ return '<div class="kv"><span class="k">Objet ' + (i+1) + '</span><span class="v">' + escapeHtml(o.label) + '</span></div>'; }).join('') +
        '</div>';
      }
      return '<div class="section"><div class="section-title">' + title + '</div>' +
        '<div class="detail-photo"><img src="' + p.dataUrl + '" alt=""></div>' +
        extra + '</div>';
    };
    var mapSection = (function(){
      var m = e.map;
      if(!m || !m.dataUrl){
        return '<div class="section"><div class="section-title">Carte du point</div><div class="hint">Aucune carte enregistree pour cette fiche.</div></div>';
      }
      var coordsLine = (typeof m.lat === 'number' && typeof m.lon === 'number')
        ? '<div class="coord-line"><span>&#128205; ' + fmtCoordsPlain({lat:m.lat, lon:m.lon}) + '</span>' +
          '<button data-action="copy-coords" data-text="' + escapeHtml(m.lat.toFixed(6) + ', ' + m.lon.toFixed(6)) + '">Copier</button></div>'
        : '';
      return '<div class="section"><div class="section-title">Carte du point</div>' +
        '<div class="detail-photo"><img src="' + m.dataUrl + '" alt="Carte du point"></div>' +
        coordsLine +
        (m.manual ? '<div class="hint" style="margin-top:6px;">Image chargee manuellement.</div>' : '') +
        '</div>';
    })();
    return '<div>' +
      '<div class="section">' +
        '<div class="section-title">Identification</div>' +
        (e.incomplete ? '<div class="kv"><span class="k">Completude</span><span class="v"><span class="chip chip-warn">&#9888; Fiche incomplete</span></span></div>' : '') +
        '<div class="kv"><span class="k">Nom du point</span><span class="v">' + escapeHtml(e.pointName) + '</span></div>' +
        (e.natureDuPoint ? '<div class="kv"><span class="k">Nature du point</span><span class="v">' + escapeHtml(e.natureDuPoint) + '</span></div>' : '') +
        (e.numeroDossier ? '<div class="kv"><span class="k">N&deg; dossier</span><span class="v">' + escapeHtml(e.numeroDossier) + '</span></div>' : '') +
        '<div class="kv"><span class="k">Cree le</span><span class="v">' + fmtDateTime(e.createdAt) + '</span></div>' +
        (e.remarks ? '<div class="kv"><span class="k">Remarques</span><span class="v">' + escapeHtml(e.remarks) + '</span></div>' : '') +
      '</div>' +
      photoCard('close', 'Photo de pres') +
      mapSection +
      photoCard('env1', 'Photo environnement 1') +
      photoCard('env2', 'Photo environnement 2') +
      '<div style="display:flex;gap:10px;margin-top:4px;">' +
        '<button class="btn btn-secondary btn-block" data-action="edit-entry" data-id="' + e.id + '">Modifier</button>' +
        '<button class="btn btn-secondary btn-block" data-action="export-entry-photos" data-id="' + e.id + '">Exporter photos (PDF)</button>' +
      '</div>' +
      '<div style="margin-top:10px;">' +
        '<button class="btn btn-secondary btn-block" data-action="export-entry-fiche" data-id="' + e.id + '">Envoyer cette fiche vers un autre telephone</button>' +
        '<p class="hint" style="margin-top:6px;">Enregistre un fichier de la fiche complete (donnees + photos) que vous pouvez envoyer par e-mail, message ou AirDrop, puis importer dans l\'app sur l\'autre telephone (bouton &laquo;&nbsp;Importer&nbsp;&raquo; depuis la liste des fiches).</p>' +
      '</div>' +
      '<div style="margin-top:10px;">' +
        '<button class="btn btn-danger btn-block" data-action="delete-entry" data-id="' + e.id + '">Supprimer la fiche</button>' +
      '</div>' +
    '</div>';
  }

  /* ---------- form actions ---------- */
  function startNewEntry(){
    resetFormState();
    showView('form');
  }
  function startEditEntry(id){
    var e = state.entries.find(function(x){ return x.id === id; });
    if(!e) return;
    resetFormState();
    state.editingId = id;
    draft.pointName = e.pointName || '';
    draft.natureDuPoint = e.natureDuPoint || '';
    draft.numeroDossier = e.numeroDossier || '';
    draft.remarks = e.remarks || '';
    state.mapMeta = (e.map && e.map.dataUrl)
      ? {status:'ready', dataUrl: e.map.dataUrl, lat: e.map.lat, lon: e.map.lon, manual: !!e.map.manual}
      : null;
    ['close','env1','env2'].forEach(function(slot){
      if(e.photos && e.photos[slot]){
        var src = e.photos[slot];
        state.photoMeta[slot] = {
          dataUrl: slot === 'close' ? src.dataUrl : (src.raw || src.dataUrl),
          coords: src.coords, takenAt: src.takenAt
        };
        if(slot !== 'close'){
          state.annotators[slot] = {annotations: normalizeAnnotations(src.annotations ? JSON.parse(JSON.stringify(src.annotations)) : null)};
        }
      }
    });
    showView('form');
  }

  // Pour la photo de pres, une image portrait n'est pas rejetee d'office
  // (cf. fileToDataURL) mais elle n'est pas non plus acceptee en silence :
  // on demande confirmation, pour laisser passer une vraie prise a plat
  // tout en repoussant une photo reellement prise telephone en portrait.
  function confirmPortraitClosePhoto(){
    return new Promise(function(resolve, reject){
      openConfirmModal({
        title: 'Photo au format portrait',
        message: 'Cette photo est enregistree au format portrait. Si le telephone etait bien tenu a l\'horizontale (paysage) mais incline a plat vers le sol pour photographier le point, c\'est normal : vous pouvez la valider. Sinon, reprenez la photo en tenant le telephone a l\'horizontale.',
        confirmLabel: 'Valider quand meme',
        cancelLabel: 'Reprendre la photo',
        onConfirm: function(){ resolve(); },
        onCancel: function(){ reject(); }
      });
    });
  }
  function handleFilePicked(slot, file){
    if(!file) return;
    state.busySlots[slot] = true;
    var orientationMode = slot === 'close' ? 'confirm' : 'strict';
    fileToDataURL(file, 1100, orientationMode).then(function(result){
      if(slot !== 'close') return result;
      if(!result.isPortrait) return result.dataUrl;
      return confirmPortraitClosePhoto().then(function(){
        return result.dataUrl;
      }, function(){
        var err = new Error('portrait-declined');
        err.code = 'portrait-declined';
        throw err;
      });
    }).then(function(dataUrl){
      state.photoMeta[slot] = {dataUrl: dataUrl, coords: null, takenAt: new Date().toISOString()};
      delete state.annotators[slot];
      render();
      // On garde une reference a cette recherche de position en cours : si
      // l'utilisatrice enregistre la fiche avant qu'elle ne se termine,
      // performSave() attendra ce resultat (borne par le filet de securite
      // de getLocation(), 25 s max) plutot que de sauvegarder "null"
      // prematurement alors qu'une position etait sur le point d'arriver.
      var locPromise = getLocation();
      state.locationPromises[slot] = locPromise;
      return locPromise;
    }).then(function(loc){
      if(state.photoMeta[slot]){
        state.photoMeta[slot].coords = loc.coords;
        state.photoMeta[slot].locationError = loc.errorReason;
        state.photoMeta[slot].locationDebug = {elapsedMs: loc.elapsedMs, source: loc.source};
      }
      state.busySlots[slot] = false;
      delete state.locationPromises[slot];
      // C'est la photo de pres du point qui declenche la generation de la
      // carte satellite unique de la fiche (voir mapCardHtml / generateMap).
      if(slot === 'close'){
        if(loc.coords) generateMap(loc.coords.lat, loc.coords.lon);
        else { state.mapMeta = {status:'unavailable', dataUrl:null, lat:null, lon:null, manual:false}; }
      }
      render();
    }).catch(function(err){
      state.busySlots[slot] = false;
      delete state.locationPromises[slot];
      if(err && err.code === 'portrait'){
        toast('Photo refusee : elle doit etre prise en format paysage (telephone a l\'horizontale). Reessayez.');
      } else if(err && err.code === 'portrait-declined'){
        toast('Photo non enregistree. Reprenez-la en tenant le telephone a l\'horizontale.');
      } else {
        toast('Impossible de charger cette photo.');
      }
      render();
    });
  }
  function retryLocation(slot){
    if(!state.photoMeta[slot]) return;
    state.busySlots[slot] = true;
    render();
    var locPromise = getLocation();
    state.locationPromises[slot] = locPromise;
    locPromise.then(function(loc){
      state.photoMeta[slot].coords = loc.coords;
      state.photoMeta[slot].locationError = loc.errorReason;
      state.photoMeta[slot].locationDebug = {elapsedMs: loc.elapsedMs, source: loc.source};
      state.busySlots[slot] = false;
      delete state.locationPromises[slot];
      if(slot === 'close'){
        if(loc.coords) generateMap(loc.coords.lat, loc.coords.lon);
        else { state.mapMeta = {status:'unavailable', dataUrl:null, lat:null, lon:null, manual:false}; }
      }
      render();
    });
  }

  function collectFormFields(){
    draft.pointName = (qs('#f-name') || {}).value || '';
    draft.natureDuPoint = (qs('#f-nature') || {}).value || '';
    draft.numeroDossier = (qs('#f-dossier') || {}).value || '';
    draft.remarks = (qs('#f-remarks') || {}).value || '';
  }

  function computeMissingFields(){
    var missing = [];
    if(!draft.natureDuPoint.trim()) missing.push('Nature du point');
    if(!state.photoMeta.close) missing.push('Photo de pres');
    // Object markers are optional and unlimited. Measures are unlimited but
    // at least 2 are required per environment photo once that photo exists.
    ['env1','env2'].forEach(function(slot, idx){
      var label = 'environnement ' + (idx + 1);
      if(!state.photoMeta[slot]){
        missing.push('Photo ' + label);
        return;
      }
      var ann = normalizeAnnotations(state.annotators[slot] && state.annotators[slot].annotations);
      if(ann.measures.length < 2) missing.push('Mesures ' + label + ' (minimum 2)');
    });
    return missing;
  }

  function saveEntry(){
    collectFormFields();
    if(!draft.pointName.trim()){
      toast('Merci d\'indiquer le nom du point.');
      var nameEl = qs('#f-name'); if(nameEl) nameEl.focus();
      return;
    }
    var missing = computeMissingFields();
    if(missing.length){
      openConfirmModal({
        title: 'Fiche incomplete',
        message: 'Valeurs non renseignees : ' + missing.join(', ') + '. Enregistrer quand meme ?',
        confirmLabel: 'Enregistrer quand meme',
        cancelLabel: 'Retourner completer',
        onConfirm: function(){ performSave(true); }
      });
      return;
    }
    performSave(false);
  }

  function performSave(incomplete){
    // Each environment photo's canvas image decodes asynchronously (see
    // PhotoAnnotator.ready). If the user hits "Enregistrer" right after
    // opening a fiche for editing — before that decode finishes — the
    // canvas would still be blank at that instant. Wait for every photo
    // to finish loading before actually building and saving the entry,
    // so a fast save can never capture a blank canvas as the photo.
    var readyPromises = [];
    ['env1','env2'].forEach(function(slot){
      var a = state.annotators[slot];
      if(a && a.ready) readyPromises.push(a.ready);
    });
    // De meme, si une recherche de position est encore en cours pour une
    // photo (voir handleFilePicked/retryLocation), on l'attend aussi avant
    // de finaliser : sinon un enregistrement rapide capturerait "Position
    // indisponible" alors qu'une position etait sur le point d'arriver.
    // getLocation() garantit desormais une reponse sous 25 s au maximum
    // (filet de securite), donc cette attente reste toujours bornee.
    var pendingLocations = Object.keys(state.locationPromises).map(function(slot){
      return state.locationPromises[slot];
    });
    // Meme raisonnement pour la carte satellite (v18) : sa generation est
    // asynchrone (chargement des tuiles) et n'etait pas attendue avant cette
    // correction, ce qui pouvait sauvegarder une fiche sans carte NI
    // coordonnees si l'utilisatrice enregistrait juste avant la fin du
    // telechargement (bug reel constate en usage). Bornee par le filet de
    // securite de buildSatelliteMap (12 s max).
    var pendingMap = state.mapPromise ? [state.mapPromise] : [];
    if(pendingLocations.length || pendingMap.length) toast('Enregistrement en attente de la position/carte...');
    Promise.all(readyPromises.concat(pendingLocations).concat(pendingMap)).then(function(){ finishSave(incomplete); });
  }

  function finishSave(incomplete){
    var id = state.editingId || uid();
    var createdAt = state.editingId
      ? (state.entries.find(function(x){ return x.id === id; }) || {}).createdAt || new Date().toISOString()
      : new Date().toISOString();

    var photos = {};
    ['close','env1','env2'].forEach(function(slot){
      var meta = state.photoMeta[slot];
      if(!meta || !meta.dataUrl) return;
      if(slot === 'close'){
        photos.close = {dataUrl: meta.dataUrl, coords: meta.coords, takenAt: meta.takenAt};
      } else {
        var annotator = state.annotators[slot];
        // IMPORTANT: a canvas has a non-zero width (300 by default) even
        // before its image has finished loading, so checking canvas.width
        // alone is not enough — it can pass while the canvas is still
        // blank, which previously could save an all-white "photo" if the
        // user hit Enregistrer before the image decode finished (most
        // likely right after opening a fiche for editing). Only flatten
        // once the annotator has actually finished drawing the image.
        var flattened = (annotator && annotator.loaded && annotator.canvas && annotator.canvas.width) ? encodeJpegUnderSize(annotator.canvas, MAX_PHOTO_BYTES) : meta.dataUrl;
        photos[slot] = {
          raw: meta.dataUrl,
          dataUrl: flattened,
          coords: meta.coords, takenAt: meta.takenAt,
          annotations: annotator ? annotator.annotations : {measures:[], objects:[]}
        };
      }
    });

    var entry = {
      id: id, createdAt: createdAt, updatedAt: new Date().toISOString(),
      pointName: draft.pointName.trim(), natureDuPoint: draft.natureDuPoint.trim(), numeroDossier: draft.numeroDossier.trim(), remarks: draft.remarks.trim(),
      incomplete: !!incomplete,
      photos: photos,
      map: (state.mapMeta && state.mapMeta.dataUrl)
        ? {dataUrl: state.mapMeta.dataUrl, lat: state.mapMeta.lat, lon: state.mapMeta.lon, manual: !!state.mapMeta.manual}
        : null
    };

    // Keep this fiche on the device right away — the app has no shared
    // backend, so IndexedDB on this phone is the one and only copy.
    var i = state.entries.findIndex(function(x){ return x.id === id; });
    if(i >= 0) state.entries[i] = entry; else state.entries.unshift(entry);
    sortEntries();
    state.editingId = null;
    toast('Fiche enregistree sur cet appareil.');
    showView('list');

    if(dbAvailable){
      dbPut(STORE, entry).catch(function(){
        dbAvailable = false;
        state.storageUnavailable = true;
        render();
      });
    }
  }

  function deleteEntry(id){
    state.entries = state.entries.filter(function(e){ return e.id !== id; });
    if(dbAvailable) dbDelete(STORE, id).catch(function(){});
    toast('Fiche supprimee.');
    showView('list');
  }

  /* ---------- export ---------- */
  function csvEscape(v){
    var s = (v === null || v === undefined) ? '' : String(v);
    if(/[",;\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
    return s;
  }
  function exportCSV(){
    var headers = ['Nom du point','Nature du point','Numero de dossier','Fiche complete','Date creation','Remarques',
      'Lat photo pres','Lon photo pres','Precision (m) photo pres',
      'Lat photo env1','Lon photo env1','Mesures env1 (m)','Objets env1',
      'Lat photo env2','Lon photo env2','Mesures env2 (m)','Objets env2'];
    var rows = state.entries.map(function(e){
      var pc = (e.photos && e.photos.close && e.photos.close.coords) || null;
      var e1 = (e.photos && e.photos.env1) || {};
      var e2 = (e.photos && e.photos.env2) || {};
      var e1c = e1.coords || null, e2c = e2.coords || null;
      var e1a = normalizeAnnotations(e1.annotations);
      var e2a = normalizeAnnotations(e2.annotations);
      return [
        e.pointName, e.natureDuPoint, e.numeroDossier, e.incomplete ? 'Non' : 'Oui', fmtDateTime(e.createdAt), e.remarks,
        pc ? pc.lat.toFixed(6) : '', pc ? pc.lon.toFixed(6) : '', pc ? Math.round(pc.acc) : '',
        e1c ? e1c.lat.toFixed(6) : '', e1c ? e1c.lon.toFixed(6) : '',
        e1a.measures.map(function(m){ return m.distance; }).join(' ; '), e1a.objects.map(function(o){ return o.label; }).join(' ; '),
        e2c ? e2c.lat.toFixed(6) : '', e2c ? e2c.lon.toFixed(6) : '',
        e2a.measures.map(function(m){ return m.distance; }).join(' ; '), e2a.objects.map(function(o){ return o.label; }).join(' ; ')
      ].map(csvEscape).join(',');
    });
    var csv = '﻿' + headers.map(csvEscape).join(',') + '\r\n' + rows.join('\r\n');
    var stamp = new Date().toISOString().slice(0,10);
    saveFile('carnet_gps_' + stamp + '.csv', csv).then(function(ok){
      if(ok) toast('Tableau CSV enregistre. Vous pouvez le joindre a un e-mail depuis vos fichiers.');
    }).catch(function(err){
      if(err && (err.code === 'extension_not_enabled' || err.code === 'rejected_extension')){
        saveFile('carnet_gps_' + stamp + '.txt', csv).then(function(ok){
          if(ok) toast('Format CSV indisponible ici : export enregistre en .txt (memes donnees).');
        });
      } else {
        toast('Erreur lors de l\'export.');
      }
    });
  }

  function collectPhotoJobs(e){
    var jobs = [];
    var base = (e.pointName || 'point').replace(/[^a-z0-9_-]+/gi, '_');
    if(e.photos && e.photos.close) jobs.push({filename: base + '_photo_pres.jpg', label: 'Photo de pres', dataUrl: e.photos.close.dataUrl});
    if(e.map && e.map.dataUrl) jobs.push({filename: base + '_carte.jpg', label: 'Carte du point', dataUrl: e.map.dataUrl});
    if(e.photos && e.photos.env1){
      if(e.photos.env1.raw) jobs.push({filename: base + '_env1_brute.jpg', label: 'Environnement 1 (brute)', dataUrl: e.photos.env1.raw});
      jobs.push({filename: base + '_env1_annotee.jpg', label: 'Environnement 1 (cotee)', dataUrl: e.photos.env1.dataUrl});
    }
    if(e.photos && e.photos.env2){
      if(e.photos.env2.raw) jobs.push({filename: base + '_env2_brute.jpg', label: 'Environnement 2 (brute)', dataUrl: e.photos.env2.raw});
      jobs.push({filename: base + '_env2_annotee.jpg', label: 'Environnement 2 (cotee)', dataUrl: e.photos.env2.dataUrl});
    }
    return jobs;
  }

  /* ---------- grouped PDF export (no external library) ----------
     The downloads capability offers one file per confirmation and does not
     allow .zip. To let a full set of photos leave in a single confirmation,
     we build a minimal PDF ourselves: one landscape page per photo, each
     embedding the existing JPEG bytes untouched (Filter DCTDecode) so there
     is no re-encoding, plus a caption line drawn with the PDF base Helvetica
     font. Falls back to separate .jpg files if PDF export isn't available. */
  function dataURLToUint8Array(dataUrl){
    var b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
    var bin = atob(b64);
    var arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }
  function getImageDims(dataUrl){
    return new Promise(function(resolve, reject){
      var img = new Image();
      img.onload = function(){ resolve({width: img.naturalWidth || 1, height: img.naturalHeight || 1}); };
      img.onerror = function(){ reject(new Error('image-load-failed')); };
      img.src = dataUrl;
    });
  }
  function pdfEscapeText(s){
    var out = '';
    for(var i=0;i<String(s).length;i++){
      var c = s.charCodeAt(i);
      if(c > 255) c = 63; /* clamp to '?' outside Latin-1 */
      var ch = String.fromCharCode(c);
      if(ch === '\\' || ch === '(' || ch === ')') out += '\\' + ch;
      else out += ch;
    }
    return out;
  }
  function pdfPad10(n){
    var s = String(Math.max(0, Math.floor(n)));
    while(s.length < 10) s = '0' + s;
    return s;
  }
  function pdfCaptionFor(entry, label){
    var parts = [entry.pointName || 'Point sans nom'];
    if(entry.numeroDossier) parts.push('Dossier ' + entry.numeroDossier);
    parts.push(label);
    return parts.join(' - ');
  }
  function assemblePhotosPdf(entry, images){
    var pageW = 792, pageH = 612, margin = 36, captionH = 28;
    var n = images.length;
    var fontObjNum = 3;
    var imgObjNums = [], contentObjNums = [], pageObjNums = [];
    var next = 4;
    for(var i=0;i<n;i++){ imgObjNums.push(next++); contentObjNums.push(next++); pageObjNums.push(next++); }
    var totalObjs = next - 1;
    var parts = [];
    var offset = 0;
    var xref = new Array(totalObjs + 1);
    function push(str){ parts.push(str); offset += str.length; }
    function pushBytes(bytes){ parts.push(bytes); offset += bytes.length; }
    function startObj(num){ xref[num] = offset; push(num + ' 0 obj\n'); }
    function endObj(){ push('endobj\n'); }

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');

    startObj(1); push('<< /Type /Catalog /Pages 2 0 R >>\n'); endObj();
    startObj(2); push('<< /Type /Pages /Kids [' + pageObjNums.map(function(p){ return p + ' 0 R'; }).join(' ') + '] /Count ' + n + ' >>\n'); endObj();
    startObj(fontObjNum); push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\n'); endObj();

    images.forEach(function(img, i){
      startObj(imgObjNums[i]);
      push('<< /Type /XObject /Subtype /Image /Width ' + img.width + ' /Height ' + img.height +
        ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.bytes.length + ' >>\nstream\n');
      pushBytes(img.bytes);
      push('\nendstream\n');
      endObj();

      var maxW = pageW - margin*2, maxH = pageH - margin*2 - captionH;
      var scale = Math.min(maxW / img.width, maxH / img.height);
      var drawW = img.width * scale, drawH = img.height * scale;
      var x = (pageW - drawW) / 2;
      var y = margin + captionH + (maxH - drawH) / 2;
      var caption = pdfEscapeText(pdfCaptionFor(entry, img.label));
      var content = 'q\n' + drawW.toFixed(2) + ' 0 0 ' + drawH.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm\n/Im' + i + ' Do\nQ\n' +
        'BT\n/F1 11 Tf\n' + margin.toFixed(2) + ' ' + (margin + 8).toFixed(2) + ' Td\n(' + caption + ') Tj\nET\n';

      startObj(contentObjNums[i]);
      push('<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\n');
      endObj();

      startObj(pageObjNums[i]);
      push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pageW + ' ' + pageH + '] /Resources << /XObject << /Im' + i + ' ' + imgObjNums[i] +
        ' 0 R >> /Font << /F1 ' + fontObjNum + ' 0 R >> >> /Contents ' + contentObjNums[i] + ' 0 R >>\n');
      endObj();
    });

    var xrefStart = offset;
    push('xref\n0 ' + (totalObjs + 1) + '\n');
    push('0000000000 65535 f \n');
    for(var num=1; num<=totalObjs; num++) push(pdfPad10(xref[num]) + ' 00000 n \n');
    push('trailer\n<< /Size ' + (totalObjs + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefStart + '\n%%EOF');

    var byteParts = parts.map(function(p){
      if(typeof p !== 'string') return p;
      var arr = new Uint8Array(p.length);
      for(var i=0;i<p.length;i++) arr[i] = p.charCodeAt(i) & 0xFF;
      return arr;
    });
    return new Blob(byteParts, {type:'application/pdf'});
  }
  function buildPhotosPdfBlob(entry, jobs){
    return Promise.all(jobs.map(function(j){
      return getImageDims(j.dataUrl).then(function(dims){
        return {label: j.label, width: dims.width, height: dims.height, bytes: dataURLToUint8Array(j.dataUrl)};
      });
    })).then(function(images){ return assemblePhotosPdf(entry, images); });
  }
  function exportEntryPhotosSeparate(jobs){
    (function next(i){
      if(i >= jobs.length){ toast('Export des photos termine.'); return; }
      saveFile(jobs[i].filename, dataURLtoBlob(jobs[i].dataUrl)).then(function(){ next(i+1); })
        .catch(function(err){
          if(err && err.code === 'declined'){ next(i+1); } else { toast('Erreur export photo.'); next(i+1); }
        });
    })(0);
  }
  function exportEntryPhotos(id){
    var e = state.entries.find(function(x){ return x.id === id; });
    if(!e) return;
    var jobs = collectPhotoJobs(e);
    if(!jobs.length){ toast('Aucune photo a exporter pour cette fiche.'); return; }
    var base = (e.pointName || 'point').replace(/[^a-z0-9_-]+/gi, '_');
    toast('Preparation du PDF groupe…');
    buildPhotosPdfBlob(e, jobs).then(function(blob){
      return saveFile(base + '_photos.pdf', blob);
    }).then(function(ok){
      if(ok) toast('PDF avec les ' + jobs.length + ' photos enregistre.');
    }).catch(function(err){
      if(err && err.code === 'declined') return;
      if(err && (err.code === 'extension_not_enabled' || err.code === 'rejected_extension' || err.code === 'too_large')){
        toast('Export groupe en PDF indisponible ici : envoi des photos une par une.');
      } else {
        toast('Echec de l\'export groupe : envoi des photos une par une.');
      }
      exportEntryPhotosSeparate(jobs);
    });
  }

  /* ---------- transfert d'une fiche vers un autre telephone ----------
     Chaque telephone a son propre carnet local (pas de synchronisation),
     mais l'utilisatrice peut avoir besoin de faire passer une fiche precise
     sur un autre appareil (e-mail, message, AirDrop...). On exporte la
     fiche complete (donnees + photos deja compressees) dans un seul fichier
     .json, et on laisse le choix du moyen d'envoi a l'utilisatrice : si le
     telephone le permet, on ouvre directement le partage natif (Mail,
     Messages, WhatsApp, AirDrop, etc. selon ce qui est installe) ; sinon on
     enregistre simplement le fichier, a joindre ensuite manuellement. */
  function shareOrSaveFiche(filename, json){
    var file = null;
    try{ file = new File([json], filename, {type:'application/json'}); }catch(err){ file = null; }
    if(file && navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share({files:[file], title: filename, text: 'Fiche GPS terrain'}).then(function(){
        toast('Fiche prete a l\'envoi.');
      }).catch(function(err){
        if(err && err.name === 'AbortError') return; // partage annule par l'utilisatrice, rien a signaler
        saveFile(filename, json).then(function(ok){
          if(ok) toast('Fiche enregistree. Joignez-la a un e-mail, message ou AirDrop.');
        });
      });
    } else {
      saveFile(filename, json).then(function(ok){
        if(ok) toast('Fiche enregistree. Joignez-la a un e-mail, message ou AirDrop.');
      });
    }
  }
  function exportEntryFiche(id){
    var e = state.entries.find(function(x){ return x.id === id; });
    if(!e) return;
    var payload = {app: 'carnet-gps-terrain', version: 1, exportedAt: new Date().toISOString(), entry: e};
    var json = JSON.stringify(payload);
    var base = (e.pointName || 'point').replace(/[^a-z0-9_-]+/gi, '_');
    shareOrSaveFiche('fiche_' + base + '.json', json);
  }
  function importEntryFromFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var payload;
      try{ payload = JSON.parse(reader.result); }catch(err){ toast('Fichier illisible : ce n\'est pas un fichier de fiche ou de carnet valide.'); return; }
      // Depuis v26, le meme bouton "Importer" accepte aussi un fichier de
      // carnet de terrain (payload.carnet), reconnu avant les fiches pour
      // eviter toute ambiguite avec les formats existants. Depuis v27,
      // plusieurs carnets a la fois (payload.carnets, tableau) sont lus de
      // la meme maniere que plusieurs fiches a la fois (payload.entries).
      if(payload && payload.app === 'carnet-gps-terrain' && Array.isArray(payload.carnets)){
        var carnetSources = payload.carnets.filter(function(x){ return x && typeof x === 'object'; });
        var carnetNames = [];
        carnetSources.forEach(function(source){
          var name = addImportedCarnet(source);
          if(name !== null) carnetNames.push(name);
        });
        if(!carnetNames.length){ toast('Fichier illisible : ce n\'est pas un fichier de fiche ou de carnet valide.'); return; }
        sortCarnets();
        render();
        toast(carnetNames.length === 1
          ? 'Carnet "' + carnetNames[0] + '" importe sur cet appareil.'
          : carnetNames.length + ' carnets importes sur cet appareil.');
        return;
      }
      if(payload && payload.app === 'carnet-gps-terrain' && payload.carnet && typeof payload.carnet === 'object'){
        importCarnetFromPayload(payload.carnet);
        return;
      }
      // Depuis v25, un fichier peut contenir plusieurs fiches a la fois
      // (payload.entries, tableau) en plus du format a une seule fiche
      // existant depuis v14 (payload.entry) ; les deux formats restent lus.
      var sources = [];
      if(payload && payload.app === 'carnet-gps-terrain' && Array.isArray(payload.entries)){
        sources = payload.entries.filter(function(x){ return x && typeof x === 'object'; });
      } else if(payload && payload.app === 'carnet-gps-terrain' && payload.entry && typeof payload.entry === 'object'){
        sources = [payload.entry];
      } else if(payload && typeof payload === 'object' && (payload.pointName !== undefined || payload.photos)){
        sources = [payload];
      }
      if(!sources.length){ toast('Fichier illisible : ce n\'est pas un fichier de fiche ou de carnet valide.'); return; }
      var importedNames = [];
      sources.forEach(function(source){
        var imported;
        try{ imported = JSON.parse(JSON.stringify(source)); }catch(err){ return; }
        // Nouvel identifiant systematique : evite tout conflit avec une fiche
        // deja presente sur ce telephone, y compris en cas de reimport de la
        // meme fiche (ex: envoyee par erreur deux fois).
        imported.id = uid();
        imported.importedAt = new Date().toISOString();
        state.entries.unshift(imported);
        importedNames.push(imported.pointName || 'sans nom');
        if(dbAvailable){
          dbPut(STORE, imported).catch(function(){
            dbAvailable = false;
            state.storageUnavailable = true;
            render();
          });
        }
      });
      if(!importedNames.length){ toast('Fichier illisible : ce n\'est pas un fichier de fiche ou de carnet valide.'); return; }
      sortEntries();
      render();
      toast(importedNames.length === 1
        ? 'Fiche "' + importedNames[0] + '" importee sur cet appareil.'
        : importedNames.length + ' fiches importees sur cet appareil.');
    };
    reader.onerror = function(){ toast('Erreur de lecture du fichier.'); };
    reader.readAsText(file);
  }

  function extractSelectedPhotosZip(){
    var entries = selectedEntries();
    if(!entries.length){ toast('Aucune fiche selectionnee.'); return; }
    var files = [];
    var usedNames = {};
    function uniqueName(base, ext){
      var name = base + '.' + ext, n = 2;
      while(usedNames[name]){ name = base + '_' + n + '.' + ext; n++; }
      usedNames[name] = true;
      return name;
    }
    entries.forEach(function(e){
      var base = sanitizeFilenamePart(e.pointName || 'point');
      var photos = e.photos || {};
      if(photos.close && photos.close.dataUrl){
        files.push({name: uniqueName(base + '_pres', 'jpg'), bytes: dataURLToBytes(photos.close.dataUrl)});
      }
      ['env1', 'env2'].forEach(function(slot, idx){
        var p = photos[slot];
        if(!p) return;
        var label = 'env' + (idx + 1);
        if(p.raw){ files.push({name: uniqueName(base + '_' + label + '_brute', 'jpg'), bytes: dataURLToBytes(p.raw)}); }
        if(p.dataUrl){ files.push({name: uniqueName(base + '_' + label + '_annotee', 'jpg'), bytes: dataURLToBytes(p.dataUrl)}); }
      });
      if(e.map && e.map.dataUrl){
        files.push({name: uniqueName(base + '_carte', 'jpg'), bytes: dataURLToBytes(e.map.dataUrl)});
      }
    });
    if(!files.length){ toast('Aucune photo trouvee dans les fiches selectionnees.'); return; }
    var zipBytes;
    try{ zipBytes = buildZip(files); }catch(err){ toast('Erreur lors de la creation du fichier .zip.'); return; }
    var blob = new Blob([zipBytes], {type: 'application/zip'});
    var stamp = new Date().toISOString().slice(0, 10);
    saveFile('photos_carnet_' + stamp + '.zip', blob).then(function(ok){
      if(ok) toast('Photos extraites : ' + files.length + ' fichier' + (files.length === 1 ? '' : 's') + ' JPG dans un .zip.');
    }).catch(function(){ toast('Erreur lors de l\'extraction des photos.'); });
  }

  function buildCarnetMatrix(carnet){
    var cell = function(v, s){ return {v: v, s: s || 0}; };
    var matrix = [];
    matrix.push([null, cell('FICHE Station GPS', 3)]);
    matrix.push([]);
    matrix.push([null, cell('CHANTIER :', 1), cell(carnet.chantier || '')]);
    matrix.push([null, cell('Numero de dossier :', 1), cell(carnet.dossier || '')]);
    matrix.push([null, cell('Repertoire vidage :', 1), cell(carnet.repertoireVidage || '')]);
    matrix.push([]);
    matrix.push([
      cell('N', 2), cell('DATE', 2), cell('SESSION', 2), cell('JOB', 2), cell('POINT', 2),
      cell('H. Antenne', 2), cell('Heure DEBUT', 2), cell('Heure FIN', 2),
      cell('Bullage debut', 2), cell('Bullage fin', 2), cell('N GPS', 2), cell('OBSERVATIONS', 2)
    ]);
    (carnet.rows || []).forEach(function(row, idx){
      matrix.push([
        cell(idx + 1), cell(row.date || ''), cell(row.session || ''), cell(row.job || ''), cell(row.point || ''),
        cell(row.hAntenne || ''), cell(row.heureDebut || ''), cell(row.heureFin || ''),
        cell(row.bullageDebut || ''), cell(row.bullageFin || ''), cell(row.numGps || ''), cell(row.observations || '')
      ]);
    });
    return matrix;
  }

  // Coeur de l'import d'un carnet, partage entre l'import d'un seul carnet
  // (payload.carnet) et l'import groupe de plusieurs carnets a la fois
  // (payload.carnets, v27) : insere le carnet avec un nouvel id, sans
  // afficher de toast (laisse a l'appelant le choix du message, unique ou
  // recapitulatif). Retourne le nom affichable du carnet importe, ou null
  // si la source est illisible.
  function addImportedCarnet(source){
    var imported;
    try{ imported = JSON.parse(JSON.stringify(source)); }
    catch(err){ return null; }
    imported.id = uid();
    imported.importedAt = new Date().toISOString();
    if(!Array.isArray(imported.rows)) imported.rows = [];
    // Assure un identifiant stable par ligne, necessaire pour les champs du
    // formulaire (certains anciens exports pourraient ne pas en avoir).
    imported.rows.forEach(function(row){ if(!row.id) row.id = uid(); });
    state.carnets.unshift(imported);
    dbPut(CARNET_STORE, imported).catch(function(){});
    return imported.chantier || imported.dossier || 'sans nom';
  }
  function importCarnetFromPayload(source){

    sortCarnets();
    render();
    toast('Carnet "' + name + '" importe sur cet appareil.');

  function extractSelectedCarnetsXlsx(){
    var carnets = selectedCarnets();
    if(!carnets.length){ toast('Aucun carnet selectionne.'); return; }
    var files = [];
    var usedNames = {};
    function uniqueName(base){
      var name = base + '.xlsx', n = 2;
      while(usedNames[name]){ name = base + '_' + n + '.xlsx'; n++; }
      usedNames[name] = true;
      return name;
    }
    try{
      carnets.forEach(function(c){
        var base = sanitizeFilenamePart(c.dossier || c.chantier || 'carnet');
        files.push({name: uniqueName(base), bytes: buildXlsxBytes('Carnet', buildCarnetMatrix(c))});
      });
    }catch(err){ toast('Erreur lors de la creation des fichiers .xlsx.'); return; }
    var stamp = new Date().toISOString().slice(0, 10);
    // Un seul carnet selectionne : fichier .xlsx direct, pas la peine de le
    // zipper pour un seul fichier.
    if(files.length === 1){
      var blob1 = new Blob([files[0].bytes], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      saveFile(files[0].name, blob1).then(function(ok){
        if(ok) toast('Carnet exporte en .xlsx.');
      }).catch(function(){ toast('Erreur lors de l\'export du carnet.'); });
      return;
    }
    var zipBytes;
    try{ zipBytes = buildZip(files); }catch(err){ toast('Erreur lors de la creation du fichier .zip.'); return; }
    var blob = new Blob([zipBytes], {type: 'application/zip'});
    saveFile('carnets_xlsx_' + stamp + '.zip', blob).then(function(ok){
      if(ok) toast(files.length + ' carnets exportes en .xlsx dans un .zip.');
    }).catch(function(){ toast('Erreur lors de l\'export des carnets.'); });
  }

  /* ---------- event delegation ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var action = el.dataset.action;
    if(action === 'go-fiches') showView('list');
    else if(action === 'go-carnets') showView('carnet-list');
    else if(action === 'back-to-home') showView('home');
    else if(action === 'new-entry') startNewEntry();
    else if(action === 'open-entry'){
      if(state.selectMode){ toggleSelectEntry(el.dataset.id); }
      else { state.editingId = el.dataset.id; showView('detail'); }
    }
    else if(action === 'toggle-select-mode'){
      state.selectMode = !state.selectMode;
      state.selectedIds = {};
      render();
    }
    else if(action === 'export-selected-fiches') exportSelectedFiches();
    else if(action === 'extract-selected-photos') extractSelectedPhotosZip();
    else if(action === 'toggle-select-mode-carnet'){
      state.carnetSelectMode = !state.carnetSelectMode;
      state.selectedCarnetIds = {};
      render();
    }
    else if(action === 'export-selected-carnets') exportSelectedCarnets();
    else if(action === 'extract-selected-carnets-xlsx') extractSelectedCarnetsXlsx();
    else if(action === 'new-carnet'){ resetCarnetFormState(); showView('carnet-form'); }
    else if(action === 'open-carnet'){
      if(state.carnetSelectMode){ toggleSelectCarnet(el.dataset.id); return; }
      var openedCarnet = state.carnets.find(function(x){ return x.id === el.dataset.id; });
      if(!openedCarnet) return;
      carnetDraft = {
        chantier: openedCarnet.chantier || '', dossier: openedCarnet.dossier || '',
        repertoireVidage: openedCarnet.repertoireVidage || '',
        rows: (openedCarnet.rows || []).map(function(r){ return Object.assign({}, r, {id: r.id || uid()}); })
      };
      state.editingCarnetId = openedCarnet.id;
      showView('carnet-form');
    }
    else if(action === 'cancel-carnet-form'){
      openConfirmModal({title:'Annuler ?', message:'Les modifications non enregistrees seront perdues.', confirmLabel:'Annuler', danger:true,
        onConfirm:function(){ resetCarnetFormState(); showView('carnet-list'); }});
    }
    else if(action === 'save-carnet') saveCarnet();
    else if(action === 'add-carnet-row') addCarnetRow();
    else if(action === 'delete-carnet-row') deleteCarnetRow(el.dataset.id);
    else if(action === 'delete-carnet'){
      var delCarnetId = el.dataset.id;
      openConfirmModal({title:'Supprimer ce carnet ?', message:'Cette action est definitive.', confirmLabel:'Supprimer', danger:true,
        onConfirm:function(){ deleteCarnet(delCarnetId); }});
    }
    else if(action === 'export-carnet-xlsx') exportCarnetXlsx(el.dataset.id);
    else if(action === 'export-carnet-fiche') exportCarnetFiche(el.dataset.id);
    else if(action === 'back-to-list'){ state.editingId = null; showView('list'); }
    else if(action === 'export-csv') exportCSV();
    else if(action === 'cancel-form'){
      openConfirmModal({title:'Annuler la fiche ?', message:'Les informations saisies seront perdues.', confirmLabel:'Annuler la fiche', danger:true,
        onConfirm:function(){ resetFormState(); showView('list'); }});
    }
    else if(action === 'save-entry') saveEntry();
    else if(action === 'edit-entry') startEditEntry(el.dataset.id);
    else if(action === 'delete-entry'){
      var id = el.dataset.id;
      openConfirmModal({title:'Supprimer cette fiche ?', message:'Cette action est definitive.', confirmLabel:'Supprimer', danger:true,
        onConfirm:function(){ deleteEntry(id); }});
    }
    else if(action === 'export-entry-photos') exportEntryPhotos(el.dataset.id);
    else if(action === 'export-entry-fiche') exportEntryFiche(el.dataset.id);
    else if(action === 'pick-import-fiche'){
      var importInput = qs('input[data-role="import-fiche-input"]');
      if(importInput) importInput.click();
    }
    else if(action === 'pick-photo'){
      var input = qs('input[data-role="file-input"][data-slot="' + el.dataset.slot + '"]');
      if(input) input.click();
    }
    else if(action === 'retry-location') retryLocation(el.dataset.slot);
    else if(action === 'retry-map'){
      var mm = state.mapMeta;
      if(mm && typeof mm.lat === 'number' && typeof mm.lon === 'number'){
        generateMap(mm.lat, mm.lon);
      } else if(state.locationPromises.close){
        toast('Recherche de la position deja en cours...');
      } else {
        retryLocation('close');
      }
    }
    else if(action === 'pick-map-image'){
      var mapInput = qs('input[data-role="map-file-input"]');
      if(mapInput) mapInput.click();
    }
    else if(action === 'set-tool'){
      var slot = el.dataset.slot, tool = el.dataset.tool;
      var annotator = state.annotators[slot];
      if(!annotator) return;
      annotator.setTool(tool);
      qsa('.anno-btn').forEach(function(b){ b.classList.remove('active'); });
      el.classList.add('active');
      toast(tool === 'object' ? 'Touchez la photo pour placer l\'objet.' : 'Touchez deux points sur la photo.');
    }
    else if(action === 'clear-annotation'){
      var slot2 = el.dataset.slot, kind = el.dataset.kind;
      var idx = parseInt(el.dataset.index, 10);
      var annotator2 = state.annotators[slot2];
      if(!annotator2 || isNaN(idx)) return;
      if(kind === 'object') annotator2.clearObject(idx);
      else annotator2.clearMeasure(idx);
      render();
    }
    else if(action === 'open-annotator-fullscreen'){
      state.fullscreenSlot = el.dataset.slot;
      render();
    }
    else if(action === 'close-annotator-fullscreen'){
      state.fullscreenSlot = null;
      render();
    }
    else if(action === 'copy-coords'){
      var text = el.dataset.text;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('Coordonnees copiees.'); }).catch(function(){ toast('Copie impossible.'); });
      } else {
        toast('Copie non disponible.');
      }
    }
  });

  document.addEventListener('change', function(e){
    var el = e.target;
    if(el.matches('input[data-role="file-input"]')){
      var file = el.files && el.files[0];
      var slot = el.dataset.slot;
      el.value = '';
      if(file) handleFilePicked(slot, file);
    } else if(el.matches('input[data-role="import-fiche-input"]')){
      var ficheFile = el.files && el.files[0];
      el.value = '';
      if(ficheFile) importEntryFromFile(ficheFile);
    } else if(el.matches('input[data-role="map-file-input"]')){
      var mapFile = el.files && el.files[0];
      el.value = '';
      if(mapFile) handleMapFilePicked(mapFile);
    }
  });

})();
</script>
